<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YesMobility — Lead Rework Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Stessa palette/tipografia dell'app "Suggerimenti Vendita" (menu/index.html),
     per coerenza visiva tra le due app YesMobility. Se il CDN dei font non è
     raggiungibile, si torna semplicemente ai font di sistema (fallback nello stack). */
  :root{
    --bg:#14171f; --panel:#1b1f29; --panel-hover:#232837; --panel-raised:#1f2430;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
    --text:#f3f4f6; --text-dim:#9ca3af; --text-faint:#6b7280;
    --primary:#14b8a6; --primary-dark:#0f766e; --primary-text:#042f2a;
    --accent:#28c840; --danger:#ff5f57; --warn:#f59e0b;
    --sidebar:#101319; --sidebar-text:#9ca3af; --sidebar-active:#14b8a6;
    --radius:10px;
    --font-body:"IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --font-head:"Manrope","IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --field-bg:#cdf5ef; --field-text:#0b1f1c; --field-placeholder:#5f8b84;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);padding:20px 14px;display:flex;flex-direction:column;gap:4px;}
  .brand{padding:0 8px 18px 8px;text-align:center;}
  .brand span{font-size:12px;color:var(--text-faint);}
  .navbtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--sidebar-text);user-select:none;font-family:var(--font-head);font-weight:600;}
  .navbtn:hover{background:rgba(255,255,255,0.06);}
  .navbtn.active{background:var(--sidebar-active);color:var(--primary-text);}
  .navsubbtn{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 30px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--sidebar-text);user-select:none;}
  .navsubbtn:hover{background:rgba(255,255,255,0.06);}
  textarea.autogrow{overflow:hidden;resize:none;}
  .card-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
  .icon-btn{background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
  .icon-btn:hover{background:var(--panel-hover);color:var(--text);}
  .runtime-status{margin-top:auto;padding:10px 8px;font-size:11px;color:var(--text-faint);line-height:1.6;border-top:1px solid var(--border);font-family:"IBM Plex Mono",monospace;}
  .runtime-status b{color:var(--sidebar-text);}
  .sidebar-footer{margin-top:14px;padding:14px 8px 2px;border-top:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;}
  .sidebar-footer .copyright{font-size:9.5px;color:var(--text-faint);text-align:center;line-height:1.4;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
  .dot.ok{background:var(--accent);box-shadow:0 0 6px var(--accent);} .dot.ko{background:var(--danger);}
  .main{flex:1;padding:26px 32px;max-width:1180px;}
  h1{font-family:var(--font-head);font-weight:800;font-size:20px;margin:0 0 4px 0;letter-spacing:-.01em;}
  h2{font-family:var(--font-head);font-weight:700;font-size:16px;margin:0 0 14px 0;}
  h3{font-family:var(--font-head);font-weight:700;}
  .subtitle{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:7px;font-size:13.5px;
    font-family:inherit;background:var(--field-bg);color:var(--field-text);
  }
  input::placeholder,textarea::placeholder{color:var(--field-placeholder);}
  select{color-scheme:light;}
  textarea{resize:vertical;line-height:1.5;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{cursor:pointer;border:none;border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:700;font-family:var(--font-head);}
  .btn-primary{background:var(--primary);color:var(--primary-text);} .btn-primary:hover{background:#2dd4bf;}
  .btn-secondary{background:var(--panel-raised);color:var(--text);border:1px solid var(--border);} .btn-secondary:hover{background:var(--panel-hover);border-color:var(--border-strong);}
  .btn-danger{background:rgba(255,95,87,.12);color:var(--danger);border:1px solid rgba(255,95,87,.35);} .btn-danger:hover{background:rgba(255,95,87,.2);}
  .btn-ghost{background:transparent;color:var(--primary);padding:4px 8px;} .btn-ghost:hover{background:rgba(255,255,255,.06);border-radius:6px;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-raised);color:var(--text-dim);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;user-select:none;border:1px solid var(--border);}
  .chip.on{background:rgba(20,184,166,.18);color:#5eead4;border-color:rgba(20,184,166,.45);font-weight:600;}
  .chip input{margin:0;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:5px;}
  .badge.ai{background:rgba(40,200,64,.15);color:#4ade80;}
  .badge.draft{background:rgba(245,158,11,.15);color:var(--warn);}
  .badge.edited{background:rgba(255,255,255,.08);color:var(--text-dim);}
  .output-block{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--panel-raised);}
  .output-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .output-block-head h3{font-size:13.5px;margin:0;}
  .hint{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .warn-box{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d;padding:10px 12px;border-radius:7px;font-size:12.5px;margin-bottom:14px;}
  .error-box{background:rgba(255,95,87,.12);border:1px solid rgba(255,95,87,.4);color:#fca5a1;padding:10px 12px;border-radius:7px;font-size:12.5px;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  tr:hover td{background:rgba(255,255,255,.03);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow:auto;}
  .modal{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;padding:26px;max-height:90vh;overflow:auto;}
  .close-x{float:right;cursor:pointer;color:var(--text-dim);font-size:20px;line-height:1;}
  .small{font-size:12px;color:var(--text-dim);}
  .thumb{max-width:140px;max-height:100px;border-radius:6px;border:1px solid var(--border);display:block;margin-top:6px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .collapsible-toggle{font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:600;user-select:none;}
  .field-missing{background:rgba(245,158,11,.14) !important;border-color:rgba(245,158,11,.55) !important;}
  .obiezioni-missing{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.4);border-radius:8px;padding:10px;}
  /* Le due card "generate dall'AI" (Stato/canali e Analisi/strategia) in un
     azzurro più chiaro rispetto alle altre card scure, per distinguerle a colpo
     d'occhio dai dati importati (CRM/file): non sono la stessa cosa. */
  .card-ai-generated{background:rgba(167,243,208,.18);border-color:rgba(167,243,208,.45);}
  .dropzone{border:2px dashed var(--border-strong);border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;background:var(--panel-raised);color:var(--text-dim);}
  .dropzone:hover{border-color:var(--primary);background:#1c222e;}
  .dropzone.dragover{border-color:var(--primary);background:rgba(20,184,166,.08);}
  .dropzone-icon{margin-bottom:8px;color:var(--text-dim);}
  .dropzone-text{font-size:14px;color:var(--text);}
  .dropzone-hint{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .uploaded-files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px;}
  .uploaded-file-card{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel-raised);}
  .uploaded-file-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0;}
  .uploaded-file-icon{width:40px;height:40px;border-radius:6px;background:var(--panel-hover);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .uploaded-file-info{min-width:0;flex:1;}
  .uploaded-file-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .uploaded-file-meta{font-size:11px;color:var(--text-dim);}
  .uploaded-file-remove{position:absolute;top:4px;right:6px;cursor:pointer;color:var(--text-dim);font-size:12px;}
  .uploaded-file-remove:hover{color:var(--danger);}
  @media print{
    body *{visibility:hidden;}
    .modal, .modal *{visibility:visible;}
    .modal-overlay{position:static;background:none;padding:0;display:block;}
    .modal{position:absolute;top:0;left:0;width:100%;max-width:none;box-shadow:none;border:none;max-height:none;overflow:visible;padding:0;background:#fff !important;color:#111 !important;}
    .modal *{color:#111 !important;}
    .no-print{display:none !important;}
  }
</style>
</head>

/* =========================================================
   RUNTIME ADAPTER — db (storage) e sample (generazione AI)
   con feature-detection e fallback locale, perché le firme
   esatte dell'API runtime dell'Artifact non sono verificabili
   in questo ambiente di sviluppo (vedi nota README).
   ========================================================= */

const RUNTIME = { db:false, sample:false, images:false, sampleVia:null };
const LOCAL_PREFIX = "leadrework:";

async function dbGet(key, fallback){
  if (window.claude && window.claude.db && typeof window.claude.db.get === "function"){
    try { const v = await window.claude.db.get(key); RUNTIME.db = true; return (v===undefined||v===null) ? fallback : v; }
    catch(e){ console.warn("db.get fallita, uso fallback locale", e); }
  }
  try { const raw = localStorage.getItem(LOCAL_PREFIX+key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
async function dbSet(key, value){
  if (window.claude && window.claude.db && typeof window.claude.db.set === "function"){
    try { await window.claude.db.set(key, value); RUNTIME.db = true; return; }
    catch(e){ console.warn("db.set fallita, uso fallback locale", e); }
  }
  try { localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(value)); } catch(e){ console.warn("localStorage set fallito", e); }
}

function extractSampleText(res){
  if (typeof res === "string") return res;
  if (res && typeof res === "object"){
    if (typeof res.completion === "string") return res.completion;
    if (typeof res.text === "string") return res.text;
    if (typeof res.content === "string") return res.content;
    if (Array.isArray(res.content)) return res.content.map(b => (b && b.text) ? b.text : "").join("\n");
  }
  return JSON.stringify(res);
}

/* --- fallback opzionale: chiamata diretta all'API Anthropic con API key dell'utente ---
   Utile per testare la generazione AI fuori dall'ambiente Claude Artifact (es. in locale).
   La chiave resta solo nel browser (localStorage) e viene inviata solo ad api.anthropic.com.
   Richiede l'header "anthropic-dangerous-direct-browser-access" che Anthropic espone
   proprio per il pattern "bring your own API key" nei tool client-side come questo. */
const DEFAULT_ANTHROPIC_MODEL = "claude-sonnet-5";
function getAnthropicApiKey(){ try { return localStorage.getItem(LOCAL_PREFIX+"anthropic_api_key") || ""; } catch(e){ return ""; } }
function setAnthropicApiKey(v){ try { if (v) localStorage.setItem(LOCAL_PREFIX+"anthropic_api_key", v); else localStorage.removeItem(LOCAL_PREFIX+"anthropic_api_key"); } catch(e){} }
function getAnthropicModel(){ try { return localStorage.getItem(LOCAL_PREFIX+"anthropic_model") || DEFAULT_ANTHROPIC_MODEL; } catch(e){ return DEFAULT_ANTHROPIC_MODEL; } }
function setAnthropicModel(v){ try { localStorage.setItem(LOCAL_PREFIX+"anthropic_model", v || DEFAULT_ANTHROPIC_MODEL); } catch(e){} }
function getAnthropicWorkspaceId(){ try { return localStorage.getItem(LOCAL_PREFIX+"anthropic_workspace_id") || ""; } catch(e){ return ""; } }
function setAnthropicWorkspaceId(v){ try { if (v) localStorage.setItem(LOCAL_PREFIX+"anthropic_workspace_id", v); else localStorage.removeItem(LOCAL_PREFIX+"anthropic_workspace_id"); } catch(e){} }

async function callAnthropicDirect({system, user, images, apiKey, model, workspaceId}){
  const content = [];
  if (images && images.length){
    images.forEach(img => content.push({ type:"image", source:{ type: img.type || "base64", media_type: img.media_type, data: img.data } }));
  }
  content.push({ type:"text", text: user });
  const headers = {
    "content-type": "application/json",
    "x-api-key": apiKey,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true"
  };
  // Alcune API key (non scoped a un singolo workspace, tipiche di account organizzazione)
  // richiedono esplicitamente questo header con l'ID del workspace da usare.
  if (workspaceId) headers["anthropic-workspace-id"] = workspaceId;
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers,
    body: JSON.stringify({ model: model || DEFAULT_ANTHROPIC_MODEL, max_tokens: 4096, system, messages:[{role:"user", content}] })
  });
  if (!resp.ok){
    const bodyText = await resp.text().catch(()=> "");
    throw new Error("Anthropic API " + resp.status + ": " + bodyText.slice(0,200));
  }
  const data = await resp.json();
  return (data.content||[]).filter(b => b.type === "text").map(b => b.text).join("\n");
}

function hasAiRuntime(){
  // Calcolato al momento dell'uso (mai messo in cache in `state`): riflette sempre lo stato
  // corrente di window.claude e della API key, anche se sono cambiati dopo il caricamento
  // della pagina (es. l'utente ha appena salvato una API key nella tab Profilo Azienda).
  // Usata sia per gating generico dell'AI (estrazione dati/stato/obiezioni, generazione script)
  // sia per il supporto immagini, perché nell'unico modo verificabile qui i due coincidono.
  return !!(window.claude && typeof window.claude.sample === "function") || !!getAnthropicApiKey();
}
function canUseImages(){ return hasAiRuntime(); }

async function callSample({system, user, images}){
  // Ogni chiamata (generazione script, estrazione da immagini, rigenerazione) passa SEMPRE
  // da qui: il messaggio d'errore costruito in fondo è quindi identico, con la stessa
  // diagnostica (via + valori usati), a prescindere da dove è stata invocata. Non esistono
  // percorsi paralleli con diagnostica diversa: se "Testa connessione" mostra dati diversi
  // da un errore reale qui, i valori sono davvero diversi (bug di allineamento), non un
  // problema di messaggistica.
  let lastError = null;
  let lastErrorVia = null;
  if (window.claude && typeof window.claude.sample === "function"){
    try {
      const payload = { system, messages:[{role:"user", content:user}] };
      if (images && images.length) payload.images = images;
      const res = await window.claude.sample(payload);
      RUNTIME.sample = true; RUNTIME.sampleVia = "artifact";
      return extractSampleText(res);
    } catch(e){ console.warn("window.claude.sample fallita, provo fallback legacy", e); lastError = e; lastErrorVia = "Claude Artifact (window.claude.sample)"; }
  }
  if (window.claude && typeof window.claude.complete === "function"){
    try {
      const full = system ? (system + "\n\n---\n\n" + user) : user;
      const res = await window.claude.complete(full);
      RUNTIME.sample = true; RUNTIME.sampleVia = "legacy";
      return extractSampleText(res);
    } catch(e){ console.warn("window.claude.complete fallita", e); lastError = e; lastErrorVia = "Claude Artifact legacy (window.claude.complete)"; }
  }
  const apiKey = getAnthropicApiKey();
  if (apiKey){
    const model = getAnthropicModel();
    const workspaceId = getAnthropicWorkspaceId();
    try {
      const text = await callAnthropicDirect({ system, user, images, apiKey, model, workspaceId });
      RUNTIME.sample = true; RUNTIME.sampleVia = "api_key";
      return text;
    } catch(e){
      console.warn("Chiamata diretta Anthropic API fallita", e);
      lastError = e;
      lastErrorVia = "API key diretta [key ***" + apiKey.slice(-4) + ", modello " + model + ", workspace " + (workspaceId || "NESSUNO") + "]";
    }
  }
  const err = new Error(lastError
    ? ("Errore dal runtime AI via " + lastErrorVia + ": " + lastError.message)
    : "Funzione di generazione AI (sample) non disponibile: nessun runtime Claude Artifact rilevato e nessuna API key Anthropic salvata.");
  err.code = lastError ? "SAMPLE_FAILED" : "NO_AI_RUNTIME";
  throw err;
}

function exportAiSettings(){
  const data = { apiKey: getAnthropicApiKey(), model: getAnthropicModel(), workspaceId: getAnthropicWorkspaceId() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "leadrework-ai-settings.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importAiSettings(evt){
  const file = evt.target.files[0];
  evt.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      setAnthropicApiKey((data.apiKey || "").trim());
      setAnthropicModel((data.model || "").trim());
      setAnthropicWorkspaceId((data.workspaceId || "").trim());
      render();
      const el = document.getElementById("ai_settings_msg");
      if (el){ el.textContent = "Impostazioni importate ✓"; setTimeout(()=>{ if(el) el.textContent=""; }, 3000); }
    } catch(e){
      alert("File di impostazioni non valido: " + e.message);
    }
  };
  reader.readAsText(file);
}

function saveAiSettings(){
  // I campi si salvano già da soli a ogni carattere digitato (oninput): questo pulsante
  // resta solo come conferma visiva, non fa altro lavoro.
  const el = document.getElementById("ai_settings_msg");
  if (el){ el.textContent = "Salvato ✓ (valori: " + JSON.stringify({apikey: getAnthropicApiKey()?"***"+getAnthropicApiKey().slice(-4):"(vuota)", model:getAnthropicModel(), workspace:getAnthropicWorkspaceId()||"(vuoto)"}) + ")"; setTimeout(()=>{ if(el) el.textContent=""; }, 4000); }
}

async function testAiSettings(){
  // Legge SEMPRE i valori realmente salvati (gli stessi che userà generateScripts/extractDataFromFiles),
  // non i valori nei campi del form: così il test riflette esattamente cosa verrà usato davvero.
  const key = getAnthropicApiKey();
  const model = getAnthropicModel();
  const workspaceId = getAnthropicWorkspaceId();
  const msgEl = document.getElementById("ai_settings_msg");
  if (!key){ msgEl.textContent = "Nessuna API key salvata: scrivila nel campo qui sopra."; return; }
  msgEl.textContent = "Test in corso… (uso key ***" + key.slice(-4) + ", modello " + model + ", workspace " + (workspaceId||"nessuno") + ")";
  try {
    const text = await callAnthropicDirect({ system:"Rispondi solo con la parola OK, niente altro.", user:"Rispondi solo con la parola OK.", apiKey:key, model, workspaceId });
    msgEl.textContent = "✓ Connessione riuscita — risposta modello: " + text.trim().slice(0,80);
  } catch(e){
    const hint = /anthropic-workspace-id/i.test(e.message) ? " → il campo \"Workspace ID\" qui sopra è vuoto o sbagliato: compilalo e riprova." : "";
    msgEl.textContent = "✗ Errore: " + e.message + hint;
  }
}

function clearAiSettings(){
  setAnthropicApiKey("");
  setAnthropicWorkspaceId("");
  render();
  const el = document.getElementById("ai_settings_msg");
  if (el){ el.textContent = "Chiave e workspace rimossi."; setTimeout(()=>{ if(el) el.textContent=""; }, 2500); }

function processUploadedFile(file){
  const isImage = file.type.startsWith("image/");
  const isCsv = /\.csv$/i.test(file.name);
  const isExcel = /\.(xlsx|xls)$/i.test(file.name);
  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  const id = "file_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);

  if (isImage){
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          const ratio = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        state.draft.uploaded_files.push({ id, name: file.name, kind:"image", base64: canvas.toDataURL("image/jpeg", 0.7) });
        render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  } else if (isCsv){
    const reader = new FileReader();
    reader.onload = () => {
      state.draft.uploaded_files.push({ id, name: file.name, kind:"spreadsheet", rows: parseCsv(reader.result) });
      render();
    };
    reader.readAsText(file);
  } else if (isExcel){
    loadSheetJs().then(() => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const wb = XLSX.read(reader.result, {type:"binary"});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet);
          state.draft.uploaded_files.push({ id, name: file.name, kind:"spreadsheet", rows });
          render();
        } catch(e){
          alert('Impossibile leggere il file Excel "' + file.name + '": ' + e.message);
        }
      };
      reader.readAsBinaryString(file);
    }).catch(() => {
      alert('Lettura file Excel non disponibile in questo ambiente (libreria esterna non caricabile). Esporta "' + file.name + '" come CSV e riprova.');
    });
  } else if (isPdf){
    loadPdfJs().then(async () => {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const pagesToRender = Math.min(pdf.numPages, PDF_MAX_PAGES);
        for (let pageNum = 1; pageNum <= pagesToRender; pageNum++){
          const page = await pdf.getPage(pageNum);
          const baseViewport = page.getViewport({ scale: 1 });
          const scale = Math.min(PDF_PAGE_MAX_DIM / Math.max(baseViewport.width, baseViewport.height), 3);
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
          state.draft.uploaded_files.push({
            id: id + "_p" + pageNum,
            name: file.name + (pdf.numPages > 1 ? (" — pagina " + pageNum) : ""),
            kind: "image",
            base64: canvas.toDataURL("image/jpeg", 0.75)
          });
        }
        render();
        if (pdf.numPages > pagesToRender){
          alert('Il PDF "' + file.name + '" ha ' + pdf.numPages + ' pagine: per contenere i tempi ho importato solo le prime ' + pagesToRender + '. Se ti servono le altre, dividi il PDF o caricale come screenshot separati.');
        }
      } catch(e){
        alert('Impossibile leggere il PDF "' + file.name + '": ' + e.message);
      }
    }).catch(() => {
      alert('Lettura PDF non disponibile in questo ambiente (libreria esterna non caricabile). Fai uno screenshot delle pagine rilevanti e caricalo come immagine.');
    });
  } else {
    alert("Formato file non supportato: " + file.name + " (usa immagini, PDF, CSV o Excel).");
  }
}

function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return [];
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(",");
    const obj = {};
    headers.forEach((h,i) => obj[h] = (cells[i]||"").trim());
    return obj;
  });
}
let _sheetJsPromise = null;
function loadSheetJs(){
  if (window.XLSX) return Promise.resolve();
  if (_sheetJsPromise) return _sheetJsPromise;
  _sheetJsPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return _sheetJsPromise;
}
let _pdfJsPromise = null;
function loadPdfJs(){
  // Versione fissata a 3.11.174: dalla 4.x pdf.js distribuisce solo moduli ES e non
  // espone più window.pdfjsLib con un semplice <script>, quindi qui servirebbe un caricamento
  // diverso (import type=module) che romperebbe questo pattern di caricamento dinamico.
  if (window.pdfjsLib) return Promise.resolve();
  if (_pdfJsPromise) return _pdfJsPromise;
  _pdfJsPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve();
    };
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return _pdfJsPromise;
}
function collectSpreadsheetRows(){
  const out = [];
  state.draft.uploaded_files.filter(f => f.kind === "spreadsheet").forEach(f => {
    f.rows.forEach((r,i) => out.push({file:f.name, index:i, row:r}));
  });
  return out;
}

// Chiamata AI condivisa: analizza qualunque dato testuale/immagine presente nel draft
// in quel momento (che arrivi da file caricati, da import CRM, o da testo inserito a
// mano) e suggerisce stato lead, obiezioni trasversali e analisi/strategia. Non richiede
// file caricati: senza immagini analizza comunque i campi testuali già valorizzati
// (vedi buildExtractionUserPrompt, che li include sempre come "dati già noti").
async function runAiAnalysis(){
  state.extractionError = null;
  state.draft._extractionAttempted = true;
  state.draft._showAppt = true; // mostra subito i campi appuntamento, anche se evidenziati come mancanti
  if (!state.draft._statoUserSet) state.draft._statoMissing = true;
  if (!state.draft._obiezioniUserSet) state.draft._obiezioniMissing = true;

  if (!hasAiRuntime()){
    state.extractionError = "Nessun runtime AI disponibile (Claude Artifact o API key Anthropic nella tab Profilo Azienda): i campi evidenziati in ambrato vanno compilati a mano.";
    render();
    return;
  }

  state.extracting = true; render();
  try {
    const imageFiles = (state.draft.uploaded_files || []).filter(f => f.kind === "image");
    const images = imageFiles.length ? imageFiles.map(f => ({ type:"base64", media_type:"image/jpeg", data: f.base64.split(",")[1] })) : undefined;
    const raw = await callSample({ system: buildExtractionSystemPrompt(), user: buildExtractionUserPrompt(), images });
    const parsed = parseGeneratedJson(raw);
    mergeExtractedIntoDraft(parsed);
  } catch(e){
    state.extractionError = "Estrazione automatica non riuscita (" + e.message + "). I campi evidenziati in ambrato vanno compilati a mano.";
  }
  state.extracting = false;
  render();
}

function mergeExtractedIntoDraft(parsed){
  EXTRACTABLE_FIELDS.forEach(k => {
    if (parsed[k] !== undefined && String(parsed[k]).trim() !== ""){
      state.draft[k] = String(parsed[k]).trim();
    }
  });
  if (parsed.prodotto && state.profile.prodotti_selezionabili.includes(parsed.prodotto)){
    state.draft.prodotto = parsed.prodotto;
  }
  if (typeof parsed.stato_lead_suggerito === "number" && LEAD_STATES.some(s => s.id === parsed.stato_lead_suggerito)){
    state.draft.stato_lead = parsed.stato_lead_suggerito;
    state.draft.canali_attivi = defaultChannelsFor(parsed.stato_lead_suggerito);
    state.draft._statoMissing = false;
  }
  if (Array.isArray(parsed.obiezioni_suggerite)){
    const validKeys = OBIEZIONI_TRASVERSALI.map(o => o.key);
    state.draft.obiezioni_attive = parsed.obiezioni_suggerite.filter(k => validKeys.includes(k));
    state.draft._obiezioniMissing = false;
  }
}

/* --- import diretto dal CRM (estensione browser "browser-extension/") ---
   Due canali di ingresso, entrambi arrivano qui: 1) window.postMessage dal content
   script iniettato nella pagina della console (flusso automatico un-clic);
   2) incolla manuale dagli appunti (fallback/debug, non richiede l'estensione). */
function applyCrmImport(data){
  if (!data || typeof data !== "object") return;
  state.draft._extractionAttempted = true;
  state.draft._showAppt = true;
  const setIfPresent = (key) => {
    if (data[key] !== undefined && String(data[key]).trim() !== "") state.draft[key] = String(data[key]).trim();
  };
  ["nome","zona","telefono1","email","note","storico","prezzo_esistente","motivazione_rifiuto","data_appuntamento","orario_appuntamento","indirizzo"].forEach(setIfPresent);
  if (data.prodotto && state.profile.prodotti_selezionabili.includes(data.prodotto)){
    state.draft.prodotto = data.prodotto;
  }
  // Lo stato lead e le obiezioni non sono deducibili in modo affidabile dai soli dati CRM
  // (sono categorie proprie di YesMobility, non del CRM): restano da scegliere a mano,
  // con la stessa evidenziazione ambrata usata per l'estrazione AI dai file.
  if (!state.draft._statoUserSet) state.draft._statoMissing = true;
  if (!state.draft._obiezioniUserSet) state.draft._obiezioniMissing = true;
  render();
  const el = document.getElementById("crm_import_msg");
  if (el){ el.textContent = "Dati importati dal CRM ✓"; setTimeout(()=>{ if(el) el.textContent=""; }, 4000); }
  // Automatizza anche il passo successivo: subito dopo l'import, chiede all'AI
  // di suggerire stato lead/obiezioni/analisi-strategia sui dati appena arrivati,
  // senza dover premere a mano il pulsante in sezione 3 (richiede comunque una
  // API key Anthropic configurata: se manca, runAiAnalysis mostra l'avviso al
  // posto del risultato, stesso comportamento del pulsante manuale).
  runAiAnalysis();
}
window.crmImport = applyCrmImport; // ponte diretto, usato anche da eventuali script esterni

async function pasteCrmImportFromClipboard(){
  try {
    const text = await navigator.clipboard.readText();
    const data = JSON.parse(text);
    applyCrmImport(data);
  } catch(e){
    alert("Impossibile leggere dati validi dagli appunti: " + e.message);
  }
}

// Bridge per l'estensione browser: il content script iniettato in questa pagina
// (console-content.js) comunica via postMessage perché gira in un "isolated world"
// separato e non può chiamare window.crmImport direttamente.
window.addEventListener("message", (ev) => {
  if (ev.source !== window) return;
  if (ev.data && ev.data.source === "lrw-crm-extension" && ev.data.type === "crmLeadData"){
    applyCrmImport(ev.data.payload);
  }
});

function activeSlots(){
  const stato = statoById(state.draft.stato_lead);
  // Categoria "guida" per questo stato lead, desunta dallo script telefono (il canale
  // sempre presente): serve a scegliere riferimenti coerenti per i canali sintetizzati
  // sotto, così un lead in fase di apertura/primo contatto non riceve per errore un
  // riferimento WhatsApp/Email pensato come recap di una chiamata già avvenuta.
  const telefonoSlot = stato.slots.find(sl => sl.canale === "telefono");
  const telefonoScript = telefonoSlot ? scriptById(telefonoSlot.scripts[0]) : null;
  const anchorCategoria = telefonoScript ? telefonoScript.categoria : null;
  const result = [];
  CANALI_BASE.forEach(c => {
    if (!state.draft.canali_attivi[c.key]) return;
    const existing = stato.slots.filter(sl => sl.canale === c.key);
    if (existing.length){
      result.push(...existing);
    } else {
      // Il canale non ha uno slot dedicato per questo stato lead: sintetizziamo un
      // riferimento. Se esiste già un template dello stesso canale con la STESSA
      // categoria dello script telefono di questo stato (es. apertura->apertura),
      // usiamo SOLO quello: è già nel registro giusto, non gli affianchiamo mai lo
      // script telefono dello stato, altrimenti l'AI ne eredita i dettagli (es. "il
      // sopralluogo effettuato") che sono corretti al telefono ma rompono il tono di
      // primo contatto richiesto per WhatsApp/Email. Solo se NON esiste un template
      // dello stesso registro per questo canale, ripieghiamo sull'esempio "apertura"
      // generico più il contenuto dello script telefono (per non perdere informazioni
      // rilevanti, es. le opzioni proposte) — mai su script follow_up/promemoria/
      // conferma di stati/canali diversi (es. il recap "come promesso, dopo la nostra
      // chiamata..."): presuppongono un contatto precedente mai avvenuto qui.
      const byCategoria = anchorCategoria
        ? SCRIPT_LIBRARY.filter(s => s.canale === c.key && s.categoria === anchorCategoria)
        : [];
      let numeri;
      if (byCategoria.length){
        numeri = new Set(byCategoria.map(s => s.numero));
      } else {
        const apertura = SCRIPT_LIBRARY.filter(s => s.canale === c.key && s.categoria === "apertura");
        numeri = new Set(apertura.map(s => s.numero));
        if (telefonoScript) numeri.add(telefonoScript.numero);
      }
      result.push({ key: c.key, canale: c.key, label: c.label, scripts: Array.from(numeri), def: false });
    }
  });
  return result;
}

    d.analisi_strategia ? ("ANALISI E STRATEGIA CONSIGLIATA PER QUESTO LEAD — USO STRATEGICO INTERNO: leggila per scegliere argomenti, leve persuasive e priorità del messaggio, ma NON citarla né parafrasarla nel testo, direttamente o indirettamente. Vietato in particolare menzionare: sopralluoghi già effettuati, date, indirizzi, importi di preventivi precedenti (nostri o di terzi), nomi di tecnici/ingegneri/referenti, esiti di verifiche già fatte — salvo che lo script richiesto sia specificamente una conferma/promemoria di appuntamento. Il messaggio deve restare leggibile come un primo contatto, anche se questa analisi contiene una storia lunga:\n" + d.analisi_strategia + "\n") : "",
    "CANALI/SLOT RICHIESTI (genera esattamente una chiave per ciascuno, con questi nomi esatti):",
    slotsDescr,
    "",
    "OBIEZIONI TRASVERSALI DA CONSIDERARE SE PERTINENTI:",
    obiezioniDescr,
    "",
    `Rispondi con un JSON con le chiavi: ${JSON.stringify(slots.map(s=>s.key))}`
  ].join("\n");
}

function parseGeneratedJson(raw){
  let text = raw.trim();
  text = text.replace(/^```json\s*/i, "").replace(/^```\s*/,"").replace(/```\s*$/,"");
  return JSON.parse(text);
}

function localFallbackGenerate(){
  const slots = activeSlots();
  const out = {};
  slots.forEach(sl => {
    const ref = scriptById(sl.scripts[0]);
    if (!ref) return;
    if (sl.canale === "email"){
      out[sl.key] = { oggetto: substitutePlaceholders(ref.oggetto||""), corpo: substitutePlaceholders(ref.corpo||"") };
    } else {
      out[sl.key] = substitutePlaceholders(ref.testo||"");
    }
  });
  return out;
}

async function generateScripts(){
  state.generating = true;
  state.generationError = null;
  render();

  const slots = activeSlots();
  if (!slots.length){
    state.generating = false;
    state.generationError = "Seleziona almeno un canale da generare.";
    render();
    return;
  }

  let images = undefined;
  const imageFilesForGeneration = (state.draft.uploaded_files||[]).filter(f => f.kind === "image");
  if (canUseImages() && imageFilesForGeneration.length){
    images = imageFilesForGeneration.map(f => ({ type:"base64", media_type:"image/jpeg", data: f.base64.split(",")[1] }));
  }

  let raw = null;
  try {
    raw = await callSample({ system: buildSystemPrompt(), user: buildUserPrompt(), images });
  } catch(e){
    state.generatedOutput = localFallbackGenerate();
    state.generatedMeta = { source:"draft" };
    state.generationError = e.code === "NO_AI_RUNTIME"
      ? "La funzione di generazione AI (sample) non è disponibile in questo ambiente. Ho precompilato una bozza di partenza dagli script di libreria: modificala liberamente prima di usarla."
      : ("La generazione AI ha restituito un errore (" + e.message + "). Ho precompilato una bozza di partenza dagli script di libreria: modificala liberamente prima di usarla.");
    state.editedAfterGenerate = false;
    state.generating = false;
    render();
    return;
  }

  if (!raw || !String(raw).trim()){
    state.generatedOutput = null;
    state.generatedMeta = null;
    state.generationError = "La risposta dell'AI è arrivata vuota (nessun errore esplicito, ma nessun contenuto). Riprova a generare: se si ripete, il runtime AI potrebbe essere temporaneamente instabile.";
    state.generating = false;
    render();
    return;
  }

  try {
    state.generatedOutput = parseGeneratedJson(raw);
    state.generatedMeta = { source:"ai", raw };
    state.editedAfterGenerate = false;
  } catch(e){
    state.generatedOutput = { _raw: raw };
    state.generatedMeta = { source:"error" };
    state.generationError = "Non sono riuscito a interpretare la risposta come JSON valido. Trovi il testo grezzo qui sotto per correggere a mano.";
    state.editedAfterGenerate = false;
  }
  state.generating = false;
  render();
}

async function regenerateSlot(slotKey){
  const sl = activeSlots().find(s => s.key === slotKey);
  if (!sl) return;
  state.generating = true; render();
  try {
    const user = buildUserPrompt() + `\n\nRigenera SOLO la chiave "${slotKey}" con una variante alternativa, stesso formato JSON con questa singola chiave.`;
    const raw = await callSample({ system: buildSystemPrompt(), user });
    const parsed = parseGeneratedJson(raw);
    if (!state.generatedOutput) state.generatedOutput = {};
    state.generatedOutput[slotKey] = parsed[slotKey] !== undefined ? parsed[slotKey] : parsed;
  } catch(e){
    if (e.code === "NO_AI_RUNTIME"){
      const ref = scriptById(sl.scripts[0]);
      if (ref){
        state.generatedOutput = state.generatedOutput || {};
        state.generatedOutput[slotKey] = sl.canale === "email"
          ? { oggetto: substitutePlaceholders(ref.oggetto||""), corpo: substitutePlaceholders(ref.corpo||"") }
          : substitutePlaceholders(ref.testo||"");
      }
    } else {
      alert("Rigenerazione non riuscita: " + e.message);
    }
  }
  state.generating = false;
  render();
}

function renderGeneratedOutputs(){
  if (!state.generatedOutput) return "";
  const slots = activeSlots();
  const badge = state.generatedMeta && state.generatedMeta.source === "ai"
    ? `<span class="badge ai">Generato da AI</span>`
    : state.generatedMeta && state.generatedMeta.source === "draft"
      ? `<span class="badge draft">Bozza da libreria (no AI)</span>`
      : `<span class="badge edited">Testo grezzo</span>`;
  if (state.generatedOutput._raw !== undefined){
    return `<div class="output-block"><div class="output-block-head"><h3>Risposta grezza</h3>${badge}</div><textarea rows="10" oninput="state.generatedOutput._raw=this.value">${escapeHtml(state.generatedOutput._raw)}</textarea></div>`;
  }
  return slots.map(sl => {
    const val = state.generatedOutput[sl.key];
    if (val === undefined) return "";
    if (sl.canale === "email" && val && typeof val === "object"){
      return `
        <div class="output-block">
          <div class="output-block-head"><h3>${escapeHtml(sl.label)}</h3>${badge}
            <button class="btn-ghost" onclick="regenerateSlot('${sl.key}')">${icon('refresh')}Rigenera</button>
          </div>
          <div class="field"><label>Oggetto</label><input type="text" value="${escapeHtml(val.oggetto||'')}" oninput="state.generatedOutput['${sl.key}'].oggetto=this.value; state.editedAfterGenerate=true;"></div>
          <div class="field"><label>Corpo</label><textarea rows="8" oninput="state.generatedOutput['${sl.key}'].corpo=this.value; state.editedAfterGenerate=true;">${escapeHtml(val.corpo||'')}</textarea></div>
        </div>`;
    }
    return `
      <div class="output-block">
        <div class="output-block-head"><h3>${escapeHtml(sl.label)}</h3>${badge}
          <button class="btn-ghost" onclick="regenerateSlot('${sl.key}')">${icon('refresh')}Rigenera</button>
        </div>
        <textarea rows="6" oninput="state.generatedOutput['${sl.key}']=this.value; state.editedAfterGenerate=true;">${escapeHtml(typeof val === "string" ? val : JSON.stringify(val))}</textarea>
      </div>`;
  }).join("") + `
    <button class="btn-primary" onclick="saveLeadToHistory()">${icon('save')}Salva lead in storico</button>
    <button class="btn-secondary" onclick="exportForSuggerimentiVendita()">${icon('upload')}Invia a Suggerimenti Vendita</button>
    <span id="suggerimenti_vendita_msg" class="hint"></span>
  `;
}

/* =========================================================
   EXPORT PER "SUGGERIMENTI VENDITA" (altra app YesMobility, chiamate live)
   ========================================================= */

function buildSuggerimentiVenditaExport(nome, telefono, prodotto, scriptTelefono){
  // SOLO il canale telefono: Suggerimenti Vendita gestisce esclusivamente
  // telefonate, mai testi scritti (email/WhatsApp) né l'analisi interna
  // (quella non è testo da dire al cliente, è una nota per l'operatore).
  // "lead" qui alimenta il riquadro "Nome/Numero di telefono" mostrato in
  // alto nella pagina della chiamata (vedi suggerimenti-vendita-content.js).
  return {
    lead: {
      nome: nome || "",
      telefono: telefono || ""
    },
    canovaccio: {
      titolo: "Script — " + (nome || "lead") + (prodotto ? (" (" + prodotto + ")") : ""),
      testo: scriptTelefono || ""
    }
  };
}

// Parametrizzata su nome/telefono/prodotto/script invece che leggere solo
// state.draft, così la può usare sia la generazione live (sezione 5) sia un
// lead riaperto dallo storico (vedi exportHistoryItemToSuggerimentiVendita),
// che non ha un state.draft aggiornato.
function sendToSuggerimentiVendita(nome, telefono, prodotto, scriptTelefono, msgElId){
  const payload = buildSuggerimentiVenditaExport(nome, telefono, prodotto, scriptTelefono);
  if (!payload.canovaccio.testo){
    alert("Nessuno script TELEFONO disponibile per questo lead: Suggerimenti Vendita gestisce solo chiamate, non email/WhatsApp — senza uno script telefono non c'è nulla di adatto da esportare.");
    return;
  }
  // Nessun file scaricato: i dati viaggiano tramite l'estensione browser
  // (stesso meccanismo dell'import dal CRM, vedi browser-extension/), che li
  // consegna direttamente alla pagina della chiamata di Suggerimenti Vendita
  // quando si apre (o subito, se è già aperta). Se l'estensione non è
  // installata/attiva, questo postMessage semplicemente non viene raccolto
  // da nessuno: nessun errore, ma niente arriva a destinazione.
  window.postMessage({ source: "lrw-console", type: "sendToSuggerimentiVendita", payload }, "*");
  apriSuggerimentiVendita();
  const el = document.getElementById(msgElId);
  if (el){ el.textContent = "Inviato ✓ — apro Suggerimenti Vendita…"; setTimeout(()=>{ if(el) el.textContent=""; }, 4000); }
}

// Fa comparire l'app "Suggerimenti Vendita" (avvia macOS l'app se non è già
// aperta, o la porta in primo piano se lo è) tramite lo schema URL
// personalizzato registrato nel suo Info.plist (CFBundleURLTypes) — vedi
// application_openURLs_ in menu_finestra.py. Un link invisibile cliccato via
// JS, invece di window.location/window.open, così se lo schema non fosse
// registrato (app non aggiornata) non si rischia di navigare via da questa
// pagina: nel peggiore dei casi il click sul link non succede nulla.
// La prima volta Chrome mostra un avviso ("Apri Suggerimenti Vendita.app?"):
// va confermato, poi il browser se lo ricorda per le volte successive.
function apriSuggerimentiVendita(){
  const a = document.createElement("a");
  a.href = "suggerimentivendita://apri";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function exportForSuggerimentiVendita(){
  const d = state.draft;
  const scriptTelefono = state.generatedOutput && typeof state.generatedOutput.telefono === "string"
    ? state.generatedOutput.telefono : "";
  sendToSuggerimentiVendita(d.nome, d.telefono1, d.prodotto, scriptTelefono, "suggerimenti_vendita_msg");
}

function exportHistoryItemToSuggerimentiVendita(id){
  const r = state.leadsHistory[id];
  if (!r) return;
  const scriptTelefono = r.script_generati && typeof r.script_generati.telefono === "string"
    ? r.script_generati.telefono : "";
  sendToSuggerimentiVendita(r.dati_lead_input.nome, r.dati_lead_input.telefono1, r.dati_lead_input.prodotto, scriptTelefono, "suggerimenti_vendita_msg_history");
}

/* =========================================================
   STORICO
   ========================================================= */

async function saveLeadToHistory(){
  const id = "lead_" + Date.now();
  const d = state.draft;
  const record = {
    id,
    data_creazione: new Date().toISOString(),
    stato_lead: d.stato_lead,
    lavorato: false,
    canali_generati: Object.keys(state.generatedOutput||{}),
    dati_lead_input: {
      nome:d.nome, prodotto:d.prodotto, zona:d.zona, telefono1:d.telefono1, telefono2:d.telefono2, email:d.email, note:d.note, storico:d.storico,
      prezzo_esistente:d.prezzo_esistente, motivazione_rifiuto:d.motivazione_rifiuto,
      data_appuntamento:d.data_appuntamento, orario_appuntamento:d.orario_appuntamento,
      indirizzo:d.indirizzo, tempistica:d.tempistica, analisi_strategia:d.analisi_strategia
    },
    script_generati: state.generatedOutput,
    script_modificati_manualmente: !!state.editedAfterGenerate,
    obiezioni_toggle: d.obiezioni_attive.slice(),
    screenshots: (d.uploaded_files||[]).filter(f => f.kind === "image").map(f => ({ name:f.name, base64:f.base64 }))
  };
  state.leadsHistory[id] = record;
  await dbSet("leads", state.leadsHistory);
  alert("Lead salvato nello storico.");
  switchTab("storico");
}

function filteredHistoryList(){
  const all = Object.values(state.leadsHistory).sort((a,b) => b.data_creazione.localeCompare(a.data_creazione));
  return all.filter(r => {
    if (state.historyFilter.stato && String(r.stato_lead) !== state.historyFilter.stato) return false;
    if (state.historyFilter.da && r.data_creazione < state.historyFilter.da) return false;
    if (state.historyFilter.a && r.data_creazione > state.historyFilter.a + "T23:59:59") return false;
    if (state.historyFilter.lavorato === "si" && !r.lavorato) return false;
    if (state.historyFilter.lavorato === "no" && r.lavorato) return false;
    return true;
  });
}

async function toggleLavorato(id){
  const r = state.leadsHistory[id];
  if (!r) return;
  r.lavorato = !r.lavorato;
  await dbSet("leads", state.leadsHistory);
  render();
}

async function esportaStoricoExcel(){
  await loadSheetJs();
  const righe = filteredHistoryList().map(r => ({
    "Data": new Date(r.data_creazione).toLocaleString('it-IT'),
    "Cliente": r.dati_lead_input.nome || "",
    "Telefono": r.dati_lead_input.telefono1 || "",
    "Telefono (secondario)": r.dati_lead_input.telefono2 || "",
    "Email": r.dati_lead_input.email || "",
    "Prodotto": r.dati_lead_input.prodotto || "",
    "Zona": r.dati_lead_input.zona || "",
    "Stato": statoById(r.stato_lead) ? statoById(r.stato_lead).label : r.stato_lead,
    "Canali generati": (r.canali_generati||[]).join(", "),
    "Lavorato": r.lavorato ? "Sì" : "No"
  }));
  const foglio = XLSX.utils.json_to_sheet(righe);
  const cartella = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(cartella, foglio, "Storico Lead");
  XLSX.writeFile(cartella, "storico_lead_" + new Date().toISOString().slice(0,10) + ".xlsx");
}

function renderHistoryTab(){
  const all = Object.values(state.leadsHistory);
  const filtered = filteredHistoryList();
  return `
    <h1>Storico Lead</h1>
    <div class="subtitle">${all.length} lead lavorati salvati.</div>
    <div class="card">
      <div class="row">
        <select onchange="state.historyFilter.stato=this.value; render();">
          <option value="">Tutti gli stati</option>
          ${LEAD_STATES.map(s => `<option value="${s.id}" ${state.historyFilter.stato===String(s.id)?'selected':''}>${s.id}. ${escapeHtml(s.label)}</option>`).join("")}
        </select>
        <select onchange="state.historyFilter.lavorato=this.value; render();">
          <option value="" ${state.historyFilter.lavorato===''?'selected':''}>Tutti i lead</option>
          <option value="si" ${state.historyFilter.lavorato==='si'?'selected':''}>Solo lavorati</option>
          <option value="no" ${state.historyFilter.lavorato==='no'?'selected':''}>Solo da lavorare</option>
        </select>
        <input type="date" onchange="state.historyFilter.da=this.value; render();" value="${state.historyFilter.da}">
        <input type="date" onchange="state.historyFilter.a=this.value; render();" value="${state.historyFilter.a}">
        <button class="btn-secondary" onclick="esportaStoricoExcel()">${icon('download')}Esporta storico</button>
      </div>
    </div>
    <div class="card">
      ${filtered.length === 0 ? `<div class="hint">Nessun lead trovato.</div>` : `
      <table>
        <thead><tr><th>Data</th><th>Cliente</th><th>Prodotto</th><th>Stato</th><th>Canali</th><th>Lavorato</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(r => `
            <tr>
              <td>${new Date(r.data_creazione).toLocaleString('it-IT')}</td>
              <td>${escapeHtml(r.dati_lead_input.nome || '—')}</td>
              <td>${escapeHtml(r.dati_lead_input.prodotto || '—')}</td>
              <td>${escapeHtml(statoById(r.stato_lead) ? statoById(r.stato_lead).label : r.stato_lead)}</td>
              <td>${r.canali_generati.length}</td>
              <td><input type="checkbox" ${r.lavorato?'checked':''} onchange="toggleLavorato('${r.id}')" title="Segna come lavorato"></td>
              <td class="row">
                <button class="btn-ghost" onclick="openHistoryItem('${r.id}')">${icon('eye')}Apri</button>
                <button class="btn-ghost" onclick="duplicateHistoryItem('${r.id}')">${icon('copy')}Duplica</button>
                <button class="btn-ghost" style="color:var(--danger)" onclick="deleteHistoryItem('${r.id}')">${icon('trash')}Elimina</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>`}
    </div>
    ${state.historyOpen ? renderHistoryModal(state.historyOpen) : ""}
  `;
}

function openHistoryItem(id){ state.historyOpen = id; render(); }
function closeHistoryModal(){ state.historyOpen = null; render(); }

function renderHistoryModal(id){
  const r = state.leadsHistory[id];
  if (!r) return "";
  const stato = statoById(r.stato_lead);
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeHistoryModal()">
      <div class="modal">
        <span class="close-x no-print" onclick="closeHistoryModal()">×</span>
        <div class="row no-print" style="float:right;margin-right:28px;">
          <button class="btn-secondary" onclick="exportHistoryItemToSuggerimentiVendita('${r.id}')">${icon('upload')}Invia a Suggerimenti Vendita</button>
          <span id="suggerimenti_vendita_msg_history" class="hint"></span>
          <button class="btn-secondary" onclick="window.print()">${icon('print')}Stampa</button>
        </div>
        <h2>${escapeHtml(r.dati_lead_input.nome || 'Lead')} — ${escapeHtml(stato ? stato.label : '')}</h2>
        <div class="small">Creato il ${new Date(r.data_creazione).toLocaleString('it-IT')}${r.script_modificati_manualmente ? ' · modificato manualmente' : ''}</div>
        <hr class="divider">
        ${r.dati_lead_input.analisi_strategia ? `
          <div class="output-block card-ai-generated">
            <h3>${icon('sparkles')}Analisi e strategia</h3>
            <p style="white-space:pre-wrap;">${nl2br(r.dati_lead_input.analisi_strategia)}</p>
          </div>
        ` : ""}
        <div class="grid2 small">
          <div><b>Prodotto:</b> ${escapeHtml(r.dati_lead_input.prodotto||'—')}</div>
          <div><b>Zona:</b> ${escapeHtml(r.dati_lead_input.zona||'—')}</div>
          <div><b>Telefono:</b> ${escapeHtml(r.dati_lead_input.telefono1||'—')}</div>
          <div><b>Telefono (secondario):</b> ${escapeHtml(r.dati_lead_input.telefono2||'—')}</div>
          <div><b>Email:</b> ${escapeHtml(r.dati_lead_input.email||'—')}</div>
          <div><b>Prezzo esistente:</b> ${escapeHtml(r.dati_lead_input.prezzo_esistente||'—')}</div>
          <div><b>Tempistica:</b> ${escapeHtml(r.dati_lead_input.tempistica||'—')}</div>
        </div>
        <p class="small">${escapeHtml(r.dati_lead_input.note||'')}</p>
        ${(r.screenshots && r.screenshots.length) ? `<div class="row no-print" style="margin-bottom:10px;">${r.screenshots.map(s => `<img class="thumb" style="max-width:100px;max-height:70px;" src="${s.base64}" title="${escapeHtml(s.name)}">`).join("")}</div>` : ""}
        <hr class="divider">
        ${Object.entries(r.script_generati||{}).map(([k,v]) => `
          <div class="output-block">
            <h3>${escapeHtml(k)}</h3>
            ${(v && typeof v === "object")
              ? `<p><b>Oggetto:</b> ${escapeHtml(v.oggetto||'')}</p><p style="white-space:pre-wrap;">${nl2br(v.corpo||'')}</p>`
              : `<p style="white-space:pre-wrap;">${nl2br(v)}</p>`}
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function duplicateHistoryItem(id){
  const r = state.leadsHistory[id];
  if (!r) return;
  state.draft = emptyDraft();
  Object.assign(state.draft, r.dati_lead_input);
  state.draft.stato_lead = r.stato_lead;
  state.draft.canali_attivi = defaultChannelsFor(r.stato_lead);
  state.draft.obiezioni_attive = (r.obiezioni_toggle||[]).slice();
  state.generatedOutput = null;
  state.generatedMeta = null;
  switchTab("nuovo");
}

async function deleteHistoryItem(id){
  if (!confirm("Eliminare definitivamente questo lead dallo storico?")) return;
  delete state.leadsHistory[id];
  await dbSet("leads", state.leadsHistory);
  render();
}
