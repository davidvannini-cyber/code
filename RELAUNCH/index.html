 {"id": "T04", "ph": "F0", "t": "Raccolta dati storici e scelta dei bestseller", "h": 2, "d": ["T03"], "p": 4, "what": "Il passato dice cosa vende davvero. Questo elenco decide l'Ondata 1.", "steps": ["Metodo consigliato: scarica i report indicati nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegali. In alternativa incolla i dati in «Genera».", "Dai report Amazon e Shopify ordina i design per pezzi venduti.", "Scrivi: top 5 design uomo, top 3 donna, miglior cappellino.", "Per ognuno annota prezzo, recensioni, taglie e colori più venduti.", "Segna quali design hanno recensioni buone (vantaggio sui listing esistenti)."], "ok": ["Elenco top 5 uomo, top 3 donna e 1 cappellino scritto"]}, {"id": "T05", "ph": "F0", "t": "Verifica dei costi reali", "h": 1.5, "p": 5, "what": "Il modello usa 6,50 € di maglietta+stampa, 6,50 € di spedizione, commissioni Amazon 18%, costi fissi 89 €/mese. Controlla che siano ancora veri.", "steps": ["Costo attuale di maglietta neutra + stampa per pezzo.", "Costo di spedizione del corriere per il peso reale del pacco.", "Commissioni di pagamento Shopify nel tuo piano.", "Costo mensile del piano Amazon.", "Se un valore differisce dal modello, annotalo: lo porterai nella chat per il ricalcolo."], "ok": ["Costi reali annotati e confrontati col modello"], "d": []}, {"id": "T06", "ph": "F0", "t": "Tracciamento: analytics e convenzione UTM", "h": 1.5, "d": ["T02"], "p": 7, "what": "Senza tracciamento non sai quale contenuto porta visite e ordini.", "steps": ["Attiva le statistiche Shopify e il collegamento a Google Analytics, se lo usi.", "Convenzione UTM: utm_source = instagram, tiktok, youtube oppure email; utm_medium = organic; utm_campaign = nome del contenuto.", "Crea un link in bio per ogni piattaforma con i suoi UTM.", "Apri i link da telefono e verifica che le visite compaiano nelle statistiche."], "ok": ["Link in bio con UTM pronti", "Visita di prova registrata"]}, {"id": "T07", "ph": "F0", "t": "Inventario magliette neutre e test di stampa", "h": 2, "p": 6, "what": "Garantire che la produzione on demand regga 100-200 pezzi al mese.", "steps": ["Conta le magliette neutre per taglia e colore.", "Stima il fabbisogno: 200 pezzi/mese con mix 70% uomo, 20% donna, 5% cappellini, 5% altro.", "Scorta minima: due settimane di vendite. Riordina quello che manca.", "Stampa 2 prove su colori di base diversi e testa il lavaggio."], "ok": ["Scorte annotate e riordino fatto", "Test di stampa superato"], "d": []}, {"id": "T08", "ph": "F0", "t": "Parte fiscale con il commercialista", "h": 1, "p": 40, "what": "Non blocca nulla: le previsioni sono al lordo di tasse e contributi. Serve per sapere il netto reale.", "steps": ["Conferma codice ATECO, gestione INPS e coefficiente di redditività.", "Conferma aliquota startup 5% e riduzione contributiva 35%.", "Valuta l'ipotesi di una società non italiana: effetti su IVA, resi e marketplace.", "Porta l'esito nella chat per ricalcolare il netto."], "ok": ["Esito scritto e portato nella chat"], "d": []}, {"id": "G01", "ph": "F1", "t": "Criteri di selezione dei design", "h": 1, "p": 8, "what": "Regole fisse per decidere quali design entrano in catalogo, così non scegli a sensazione.", "steps": ["Slogan breve e leggibile a due metri di distanza.", "Una o due tinte di stampa: costo basso e resa alta.", "Nessun marchio o logo di terzi (aziende di aperitivi, liquori, birre): rischio di rimozione su Amazon.", "Test del cugino: mostra il design a 5 persone. Se almeno 3 chiedono 'dove la compro?' o lo mandano a un amico, passa.", "Preferisci temi che non scadono: gli stagionali solo nell'Ondata 2."], "ok": ["Checklist dei 5 criteri scritta"], "d": []}, {"id": "G02", "ph": "F1", "t": "Selezione dei 7 prodotti dell'Ondata 1", "h": 2, "d": ["T04", "G01"], "p": 10, "what": "Decisione presa per te: 7 prodotti. 4 t-shirt uomo (3 riedizioni dei bestseller storici + 1 nuovo), 2 t-shirt donna (1 riedizione + 1 nuovo), 1 cappellino (il miglior design storico).", "steps": ["Dalla lista dei bestseller prendi i 3 migliori uomo, 1 donna, 1 cappellino.", "Aggiungi 1 design nuovo uomo e 1 nuovo donna, sul filone che già funzionava.", "Applica la checklist dei criteri a ciascuno dei 7.", "Scrivi la lista finale con colore base e prezzo (27,90 €)."], "ok": ["7 prodotti scelti e scritti", "Tutti superano la checklist"], "dec": "Perché 7: le vendite storiche erano 70% uomo, 20% donna, 5% cappellini. 7 prodotti si studiano e fotografano bene in pochi giorni e concentrano le recensioni. Più prodotti disperdono tempo e budget ads da 250 €."}, {"id": "G03", "ph": "F1", "t": "Brief e studio di ogni prodotto (1 ora ciascuno)", "h": 7, "d": ["G02"], "p": 11, "what": "Per ogni prodotto: a chi si rivolge, quale battuta lo spiega, che contenuti ne escono. È l'ora per prodotto che hai indicato.", "steps": ["Target e occasione (regalo, serata, gruppo di amici).", "3 idee di video con hook nei primi secondi.", "5 parole chiave per Amazon.", "Foto necessarie, taglie e colori.", "Prima bozza del titolo e dei benefici."], "ok": ["7 brief completati"]}, {"id": "G04", "ph": "F1", "t": "Stampa dei 7 campioni e foto reali", "h": 5, "d": ["G02", "T07"], "p": 13, "what": "Servono foto reali: l'immagine principale di Amazon deve ritrarre il prodotto vero. Costo circa 45 € (7 campioni da 6,50 €).", "steps": ["Stampa un campione per ciascun prodotto.", "Foto flat lay su sfondo bianco, luce naturale, telefono fermo.", "Foto indossata e dettaglio della stampa.", "Registra un breve video del processo di stampa: serve per i contenuti 'Dietro la stampa'."], "ok": ["7 foto principali su sfondo bianco", "Foto indossate e dettagli", "Video del processo girato"]}, {"id": "G05", "ph": "F1", "t": "Mockup e immagini lifestyle (Canva e AI)", "h": 4, "d": ["G03"], "p": 14, "what": "Immagini secondarie per sito e Amazon. L'AI vale per scene e sfondi, mai per cambiare il prodotto.", "steps": ["Mockup per ogni prodotto con colore e stampa identici al reale.", "1 o 2 eckpoint sito."], "ok": ["Ordine di prova finale riuscito", "Sito pubblico e annunciato"]}, {"id": "A01", "ph": "F3", "t": "Ricerca parole chiave Amazon", "h": 3, "d": ["G02"], "p": 25, "what": "Le parole che i clienti scrivono davvero su Amazon.it.", "steps": ["Per ogni prodotto, scrivi nella barra di Amazon e annota i suggerimenti.", "Gruppi: prodotto (t-shirt uomo spritz), tema (aperitivo, vino, prosecco, brindisi), regalo (regalo amico, compleanno), umorismo (maglietta divertente...).", "Amplia la lista con l'AI.", "Lista di negative iniziali: gratis, bambino, taglie non vendute, marchi altrui.", "Per ogni prodotto: 10 keyword principali e 15 a coda lunga."], "ok": ["Lista keyword per ognuno dei 7 prodotti", "Lista negative iniziali"]}, {"id": "A02", "ph": "F3", "t": "Regole e modello dei listing Amazon", "h": 2, "d": ["A01"], "p": 26, "what": "Un modello unico per titolo, punti elenco e immagini.", "steps": ["Titolo: massimo 75 caratteri, spazi inclusi (regola in vigore dal 27 luglio 2026): marchio + tipo di prodotto + tema o differenziatore.", "Punti salienti (Item Highlights): massimo 125 caratteri, frasi brevi separate da virgola, per materiale, uso e occasione.", "5 punti elenco: tieniti sotto 255 caratteri ciascuno (alcune categorie ne accettano fino a 500: guarda il contatore).", "Descrizione: massimo 2.000 caratteri, solo testo.", "Parole chiave nascoste: massimo 249 byte (byte, non caratteri); per sicurezza scrivine non oltre 200 byte, separate da spazi, senza ripetere parole già nel titolo e nei punti elenco.", "7 immagini: foto reale su bianco, flat lay, indossata, dettaglio, guida taglie, lifestyle, regalo. Verifica le linee guida immagini Amazon per l'abbigliamento.", "Controlla i contatori mostrati da Seller Central: valgono più di questa lista."], "ok": ["Modello scritto e validato su un prodotto"]}, {"id": "A03", "ph": "F3", "t": "Pubblicare i 7 listing Amazon dell'Ondata 1", "h": 7, "d": ["A02", "G05", "G04", "T03", "T03b"], "p": 27, "go": [{"id": "S06", "l": "Scheda del sito per lo stesso prodotto (S06)"}], "what": "Un'ora per listing. Prezzo 27,90 €, spedizione gestita da te.", "steps": ["Dal computer. Per ogni prodotto: pulsante AI di questa attività, copia ogni campo con la sua icona e incollalo in Seller Central (vedi «Come trovarlo su Amazon»).", "Titolo massimo 75 caratteri, punti salienti massimo 125, punti elenco sotto 255, descrizione massimo 2.000, parole chiave nascoste sotto 200 byte.", "Prezzo 27,90 €, tempo di preparazione 1-2 giorni.", "Controlla che immagine principale e titolo rispettino le regole.", "Annota gli ASIN.", "Per lo stesso prodotto, scrivi anche la scheda per il sito in S06 (pulsante qui sotto)."], "ok": ["7 listing attivi con ASIN annotati"]}, {"id": "A04", "ph": "F3", "t": "Creare le campagne Sponsored Products", "h": 2, "d": ["A03", "A01"], "p": 28, "what": "Budget 250 €/mese. Campagna automatica 4 €/giorno, campagna manuale 3 €/giorno, riserva di 37 €/mese per test.", "steps": ["Campagna AUTOMATICA: 4,00 €/giorno, offerta iniziale = suggerita meno 20%, strategia 'solo ribassi dinamici'.", "Campagna MANUALE: 3,00 €/giorno, parole chiave esatte e a frase dalla ricerca (circa 25 per partire), offerta iniziale = suggerita meno 10%.", "Aggiungi le negative iniziali.", "Non attivare Sponsored Brands o Display ora: valuta dopo 8 settimane.", "Non modificare le offerte prima di 100 clic totali."], "ok": ["Due campagne attive", "Negative inserite"]}, {"id": "A05", "ph": "F3", "t": "Primo controllo ads dopo 72 ore", "h": 0.5, "d": ["A04"], "lag": 3, "p": 29, "what": "Verifica solo che tutto giri: impressioni, spesa, nessun errore.", "steps": ["Metodo consigliato: scarica il report indicato nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegalo: la chat applica le regole decise e ti dà le azioni. In alternativa incolla il testo del report in «Genera».", "Le campagne spendono e hanno impressioni?", "Scorri il report dei termini di ricerca e aggiungi le negative evidenti.", "Non cambiare offerte."], "ok": ["Campagne attive e senza errori"]}, {"id": "A06", "ph": "F3", "t": "Procedura per richiedere le recensioni", "h": 1, "d": ["A03"], "p": 31, "what": "Le recensioni alzano le vendite organiche. Metodo ammesso.", "steps": ["Usa il pulsante 'Richiedi una recensione' di Seller Central per ogni ordine consegnato.", "Nessun incentivo e nessuna richiesta di recensioni positive.", "Non usare inserti che portano i clienti fuori da Amazon: controlla la policy attuale prima."], "ok": ["Procedura scritta e provata su un ordine"]}, {"id": "N01", "ph": "ST", "t": "Mappa della nicchia e dei competitor (fatta dall'AI)", "h": 0.5, "p": 7.1, "what": "Chi c'è nel merchandising ironico su vino e aperitivo, cosa fa, a che prezzo, con quale tono, dove restano spazi liberi. Lavoro interamente dell'AI con ricerca web: tu premi un pulsante e leggi il riepilogo.", "steps": ["Premi AI e poi Genera: non devi inserire nulla.", "Leggi il riepilogo (circa 10 minuti).", "Salva il risultato nella nota."], "ok": ["Tabella competitor con fonti letta", "Risultato salvato nella nota"], "dec": "Ogni affermazione deve avere una fonte o essere segnata come ipotesi: l'AI non può inventare account, seguaci o prezzi.", "d": []}, {"id": "N02", "ph": "ST", "t": "Raccolta automatica dai social e dai contenuti già virali (AI + connettore)", "h": 0.5, "p": 7.3, "d": ["N01"], "what": "L'AI raccoglie da sola i contenuti che funzionano nella nicchia (formati, hook, durate, ironia) e individua quelli già diventati virali, usando il connettore browser (TinyFish) e fonti pubbliche. Tu non osservi né annoti nulla.", "steps": ["Se non è collegato, collega il connettore browser da Impostazioni > Collega i connettori (una volta sola).", "Premi AI e poi Avvia in chat: il prompt si copia e si apre una nuova chat. Incollalo e lascia lavorare l'AI (10-20 minuti).", "Alla fine la chat scrive un blocco RIEPILOGO PER L'AGENDA: copialo e incollalo nel campo 'Riepilogo dalla chat' di questa attività, poi Salva riepilogo."], "ok": ["Raccolta eseguita in chat", "Riepilogo incollato e salvato nell'attività"], "dec": "Regole di raccolta (D20): solo pagine pubbliche, nessun login con account personali, nessun aggiramento di blocchi, basso volume. Se una piattaforma è bloccata l'AI lo dichiara e passa alla fonte successiva: non inventa mai dati."}, {"id": "N03", "ph": "ST", "t": "Tendenze in salita e calendario stagionale (fatti dall'AI)", "h": 0.5, "p": 7.4, "what": "Tendenze e momenti dell'anno su cui costruire contenuti. Due modi: in app con la ricerca web (un clic) oppure in chat con il browser agent, che legge anche Google Trends e TikTok Creative Center.", "steps": ["Premi AI: scegli Genera (solo ricerca web) oppure Avvia in chat (con Google Trends e TikTok Creative Center letti dall'AI).", "Se hai usato la chat, incolla il riepilogo nel campo dedicato e salva.", "Controlla soltanto le date del calendario stagionale che l'AI ha verificato."], "ok": ["Calendario stagionale ottobre-marzo salvato", "Elenco tendenze valutate salvato"], "d": []}, {"id": "N04", "ph": "ST", "t": "Voce dei clienti dai dati Shopify e dalle recensioni dei concorrenti (AI + connettore)", "h": 0.5, "p": 7.2, "what": "L'AI legge dallo store (connettore Shopify) ordini, prodotti più venduti, clienti ricorrenti, note d'ordine, e raccoglie recensioni pubbliche di prodotti concorrenti. Ne ricava motivi d'acquisto, occasioni, linguaggio e obiezioni. Nessun copia e incolla.", "steps": ["Premi AI e poi Avvia in chat: il prompt si copia e si apre una nuova chat. Incollalo: l'AI usa il connettore Shopify da sola.", "Alla fine copia il blocco RIEPILOGO PER L'AGENDA e incollalo nel campo dedicato di questa attività."], "ok": ["Analisi eseguita in chat", "Riepilogo salvato nell'attività"], "dec": "Dati personali dei clienti: l'AI lavora su dati aggregati e non riporta nomi, email o indirizzi.", "d": []}, {"id": "N04b", "ph": "ST", "t": "Voce dei clienti dalle recensioni Amazon (copiate a mano)", "h": 0.5, "p": 47, "hid": true, "what": "Compare quando l'account Amazon è utilizzabile. Per Amazon.it non esiste un connettore utilizzabile: copi a mano le recensioni dalle pagine pubbliche dei tuoi prodotti storici su amazon.it e l'AI le analizza per arricchire la strategia.", "steps": ["Dal computer apri le pagine pubbliche dei tuoi prodotti storici su amazon.it (senza login) e copia le recensioni più utili, positive e negative (anche solo 20-30).", "Incollale nel campo Note dell'AI di questa attività.", "Premi AI e poi Avvia in chat e incolla il prompt.", "Copia il blocco RIEPILOGO PER L'AGENDA nel campo dedicato.", "Rilancia N05 per aggiornare la strategia con questi dati."], "ok": ["Recensioni analizzate dall'AI", "Riepilogo salvato", "Strategia aggiornata"], "d": []}, {"id": "N05", "ph": "ST", "t": "Strategia dei contenuti: sintesi dello studio (fatta dall'AI)", "h": 1, "d": ["N01", "N02", "N03", "N04"], "p": 7.5, "what": "La base di tutto: l'AI unisce gli studi in una strategia con tono dell'ironia, pilastri aggiornati, formati, formule di hook, un punteggio di potenziale virale, il filtro per scegliere le tendenze e un piano di test di 4 settimane.", "steps": ["Premi AI: i campi si precompilano con i risultati di N01-N04.", "Premi Genera e leggi la strategia con spirito critico; chiedi correzioni nella conversazione.", "Salva nella nota. Se i pilastri cambiano rispetto a D11, annotalo e portalo in chat per aggiornare l'agenda."], "ok": ["Strategia salvata", "Punteggio di potenziale virale e filtro tendenze scritti", "Piano di test di 4 settimane scritto"], "dec": "Obiettivo del cliente: contenuti con potenziale virale. Nessuno strumento può garantire o prevedere la viralità. Il metodo la massimizza così: (1) partire da contenuti già diventati virali nella nicchia (outlier osservati), (2) punteggio di potenziale con criteri espliciti, (3) più varianti di ogni concetto, (4) apprendimento ogni settimana sui dati reali (C05), (5) sponsorizzare i vincenti solo con evidenza organica e nel rispetto di D13."}, {"id": "K01", "ph": "F4", "t": "Brand voice e 5 pilastri dei contenuti", "h": 3, "d": ["N05"], "p": 9, "what": "Parti dalla strategia di N05: i 5 pilastri (D11) sono l'ipotesi di partenza, confermati o aggiornati dallo studio. Qui li metti per iscritto con esempi.", "steps": ["Tono: ironico, complice, mai volgare, mai contro qualcuno.", "Pilastri: Il cugino, Situazioni da aperitivo, Dietro la stampa, Frase del giorno, Regali e occasioni.", "Regole: hook nel primo secondo, sottotitoli sempre, 15-25 secondi, una sola idea, una sola azione finale.", "Biblioteca di 30 hook scritta con l'AI."], "ok": ["Brand voice scritta", "30 hook pronti"]}, {"id": "K02", "ph": "F4", "t": "Profili social e collegamenti", "h": 2, "d": ["K01", "T06"], "p": 29, "what": "Instagram, TikTok e YouTube pronti e coerenti.", "steps": ["Profili con stessa immagine e bio.", "Link in bio con UTM per piattaforma.", "Collega Meta Business Suite per programmare.", "Cartelle organizzate per i file video."], "ok": ["3 profili pronti", "Link in bio con UTM attivi"]}, {"id": "K03", "ph": "F4", "t": "Strumenti: montaggio, grafica, programmazione", "h": 1.5, "d": ["K01"], "p": 30, "what": "Strumenti scelti per ridurre il tempo per contenuto. Hai già Canva Pro.", "steps": ["Montaggio e sottotitoli automatici: CapCut.", "Cover e grafiche: Canva Pro con kit brand (colori, font, logo).", "Programmazione: Meta Business Suite, TikTok Studio, YouTube Studio.", "Se un'attività gratuita costa più di 2 ore per contenuto, passa al piano a pagamento dopo due settimane."], "ok": ["Template video e kit brand pronti"], "dec": "Scelti per tempo risparmiato. Paghi solo se un tool taglia il lavoro: valuta dopo 2 settimane di uso reale."}, {"id": "K04", "ph": "F4", "t": "Banca iniziale di 10 contenuti", "h": 12, "d": ["K03", "G04"], "p": 31, "what": "Dieci contenuti pronti prima di pubblicare, per non inseguire.", "steps": ["3 'Dietro la stampa' (video del processo).", "3 'Situazioni da aperitivo' (sketch).", "2 'Il cugino' (rievocazione del passaparola).", "1 'Frase del giorno' con reveal del prodotto.", "1 'Regalo' per occasione."], "ok": ["10 contenuti montati e con sottotitoli"]}, {"id": "K05", "ph": "F4", "t": "Programmare e lanciare i primi contenuti", "h": 1, "d": ["K02", "K04"], "p": 32, "what": "Inizio della routine di pubblicazione.", "steps": ["Programma i primi 8 contenuti su Instagram, TikTok e YouTube Shorts.", "Pubblica un post feed Instagram di presentazione.", "Annota la data: parte il conteggio del checkpoint contenuti."], "ok": ["Primi contenuti programmati o pubblicati"]}, {"id": "K06", "ph": "F4", "t": "Sistema per foto e video dei clienti (UGC)", "h": 2, "d": ["S11"], "p": 33, "what": "Il tuo passaparola, reso ripetibile.", "steps": ["Nell'email dopo la consegna chiedi foto o video.", "Offri 10% sul prossimo ordine in cambio, con consenso a ripubblicare.", "Crea una cartella delle foto ricevute.", "Ripubblica nei contenuti 'Il cugino'."], "ok": ["Email e codice sconto pronti"]}, {"id": "O01", "ph": "F5", "t": "Procedura di evasione ordine (spedizione in 24 ore)", "h": 2, "d": ["T07", "T05"], "p": 34, "what": "Ordine ricevuto, stampa, controllo qualità, imballo, corriere il giorno dopo.", "steps": ["Raccogli gli ordini e stampa in un'unica sessione quando ci sono ordini da evadere.", "Controllo qualità: centratura, colore, piega, taglia.", "Imballo con bigliettino e QR per recensione o foto.", "Etichetta e consegna al corriere entro il giorno dopo.", "Invia il tracking al cliente."], "ok": ["Procedura scritta in 6 passi", "Prova eseguita con un ordine reale o finto"]}, {"id": "O02", "ph": "F5", "t": "Procedura Amazon: tracking e messaggi", "h": 1, "d": ["A03"], "p": 35, "what": "Rispettare le metriche del venditore.", "steps": ["Tempo di preparazione dichiarato 1-2 giorni.", "Carica il tracking entro 24 ore dalla spedizione.", "Rispondi ai messaggi entro 24 ore.", "Gestione resi secondo le regole Amazon."], "ok": ["Procedura scritta"]}, {"id": "O03", "ph": "F5", "t": "Modelli di risposta ai clienti", "h": 1, "p": 38, "what": "Risposte pronte per le richieste più comuni.", "steps": ["Ritardo spedizione.", "Taglia sbagliata o cambio.", "Reso.", "Prodotto difettoso.", "Richiesta di recensione dal sito."], "ok": ["5 modelli salvati"], "d": []}, {"id": "O04", "ph": "F5", "t": "Corriere: tariffe, etichette e ritiri", "h": 1, "d": ["T05"], "p": 39, "what": "Ridurre il costo di spedizione e il tempo per pacco.", "steps": ["Confronta tariffe per il peso del pacco.", "Imposta etichette automatiche.", "Programma il ritiro quando serve.", "Valuta l'assicurazione."], "ok": ["Corriere scelto e tariffa annotata"]}, {"id": "C04", "ph": "F6", "t": "Checkpoint sito dopo 28 giorni", "h": 1.5, "d": ["S11"], "lag": 28, "p": 45, "what": "Confronta visite e conversione del sito con le soglie decise.", "steps": ["Metodo consigliato, senza copiare numeri: tocca AI e poi «Avvia in chat». Claude legge i dati di Shopify con il connettore e, quando salvi il riepilogo, la scheda Dati si compila da sola (controlla i valori).", "Statistiche Shopify degli ultimi 28 giorni: sessioni, ordini, conversione.", "Fonti di traffico: da quale contenuto arrivano le visite.", "Scegli l'esito che corrisponde ai numeri."], "ok": ["Dati annotati nella tab Dati"], "out": [{"l": "Meno di 300 sessioni: dati insufficienti, rinvia di 14 giorni", "post": 14}, {"l": "Conversione sotto 0,4%", "spawn": ["C04a"]}, {"l": "Conversione tra 0,4% e 0,8%", "spawn": ["C04b"]}, {"l": "Conversione almeno 0,8% con almeno 300 sessioni", "spawn": ["C04c"]}], "dec": "Meta Ads solo se il sito converte almeno 0,8%: con 16 € di margine per ordine, il costo massimo per ordine ammesso è 10 €."}, {"id": "C04a", "ph": "F6", "t": "Audit di conversione del sito", "h": 3, "p": 44, "hid": true, "what": "Conversione troppo bassa: cerca il blocco prima di fare altro.", "steps": ["Rifai l'ordine di prova e conta i passaggi.", "Controlla dove abbandonano (carrello, checkout, spedizione).", "Valuta di abbassare la soglia di spedizione gratuita a 39,90 € se l'abbandono è alla spedizione.", "Cambia una cosa alla volta e misura per 2 settimane."], "ok": ["Causa probabile individuata e modifica fatta"], "d": []}, {"id": "C04b", "ph": "F6", "t": "Ottimizzazioni mirate del sito", "h": 2, "p": 44, "hid": true, "what": "Conversione tra 0,4% e 0,8%: miglioramenti graduali.", "steps": ["Migliora foto e titolo della pagina più visitata.", "Metti in evidenza recensioni e bundle.", "Cambia una cosa alla volta e misura per 2 settimane."], "ok": ["Modifica fatta e data annotata"], "d": []}, {"id": "C04c", "ph": "F6", "t": "Test Meta Ads: 5 € al giorno per 14 giorni", "h": 3, "p": 44, "hid": true, "what": "Il sito converte: puoi testare un po' di pubblicità a pagamento, con un tetto.", "steps": ["Budget 5 €/giorno per 14 giorni (70 €), su visitatori simili ai tuoi acquirenti.", "Costo massimo per ordine 10 €.", "Stop se dopo 100 € spesi il costo per ordine supera 16 €.", "Riporta i risultati nella chat."], "ok": ["Test avviato con tetto di spesa impostato"], "d": []}, {"id": "C01", "ph": "F6", "t": "Checkpoint ads dopo 4 settimane", "h": 1.5, "d": ["A04"], "lag": 28, "p": 45, "what": "Controllo dell'ACOS contro il piano (35% nel primo mese).", "steps": ["Metodo consigliato: scarica il report indicato nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegalo: la chat applica le regole decise e ti dà le azioni. In alternativa incolla il testo del report in «Genera».", "Esporta il report campagne dei 28 giorni.", "Calcola ACOS totale, CPC medio, clic, ordini.", "Soglia: ACOS fino al 35% è in linea; oltre, è fuori linea."], "ok": ["Report esportato e ACOS calcolato"], "out": [{"l": "ACOS fino al 35%: in linea"}, {"l": "ACOS oltre il 35% o nessuna vendita", "spawn": ["C01b"]}], "dec": "Soglie ACOS decise: 4 settimane 35%, 8 settimane 31%, 12 settimane 28%, 24 settimane 25%. Break-even Amazon: circa 35% per un ordine da 1 pezzo, circa 40% con 1,25 pezzi/ordine."}, {"id": "C01b", "ph": "F6", "t": "Piano correttivo ads", "h": 2, "p": 44, "hid": true, "what": "ACOS fuori linea: correggi senza aumentare il budget.", "steps": ["Metti in pausa le parole chiave con spesa oltre 8,50 € e zero vendite.", "Riduci del 15% le offerte delle parole con ACOS troppo alto.", "Controlla prezzo, immagini e titolo dei listing con molti clic e poche vendite.", "Mantieni il budget a 250 €/mese."], "ok": ["Correzioni fatte e annotate"], "d": []}, {"id": "C02", "ph": "F6", "t": "Checkpoint ads dopo 8 settimane", "h": 1.5, "d": ["A04"], "lag": 56, "p": 45, "what": "Soglia di ACOS a 8 settimane: 31%.", "steps": ["Metodo consigliato: scarica il report indicato nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegalo: la chat applica le regole decise e ti dà le azioni. In alternativa incolla il testo del report in «Genera».", "Esporta i dati delle ultime 8 settimane.", "Calcola ACOS e ACOS delle ultime 3 settimane.", "Scegli l'esito."], "ok": ["ACOS calcolato"], "out": [{"l": "ACOS fino al 31%, non ancora sotto il 28% per 3 settimane"}, {"l": "ACOS sotto il 28% da almeno 3 settimane", "spawn": ["C02a"]}, {"l": "ACOS oltre il 31%", "spawn": ["C01b"]}], "dec": "Il budget sale di 50 € alla volta e solo se l'ACOS resta sotto il 28% per 3 settimane. Massimo 300 €/mese; oltre solo con ACOS sotto il 25%."}, {"id": "C02a", "ph": "F6", "t": "Alzare il budget ads di 50 € al mese", "h": 0.5, "p": 44, "hid": true, "what": "Una sola variazione alla volta, poi osserva per 3 settimane.", "steps": ["Aumenta il budget giornaliero di circa 1,60 €.", "Annota la data.", "Non cambiare altro per 3 settimane."], "ok": ["Budget aggiornato e data annotata"], "d": []}, {"id": "C03", "ph": "F6", "t": "Checkpoint a 12 settimane: ricalcolo del modello", "h": 2, "d": ["A04"], "lag": 84, "p": 45, "what": "Porta i dati reali nella chat per rifare le previsioni.", "steps": ["Metodo consigliato: scarica i report Amazon indicati nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegali. Claude legge Shopify con il connettore e i report Amazon dai file; quando salvi il riepilogo la scheda Dati si compila da sola (controlla i valori).", "Tab Dati: compila i mesi trascorsi.", "Esporta il backup (Impostazioni) e portalo nella chat.", "Confronta con i tre scenari: se sei sotto il pessimista, decidi con Claude se cambiare strategia."], "ok": ["Dati inseriti e confronto fatto"]}, {"id": "C05", "ph": "F6", "t": "Checkpoint contenuti dopo 4 settimane", "h": 1.5, "d": ["K05"], "lag": 28, "p": 45, "what": "Scegli il formato che funziona davvero e raddoppia.", "steps": ["Ordina i contenuti per condivisioni e salvataggi ogni 1.000 visualizzazioni.", "Individua il formato vincente tra i 5 pilastri.", "Riduci i formati peggiori e raddoppia il migliore."], "ok": ["Formato vincente scelto"]}, {"id": "C06", "ph": "F6", "t": "Checkpoint a 6-7 mesi: scalare o cambiare rotta", "h": 2, "d": ["S11"], "lag": 190, "p": 47, "what": "Decisione finale di fase: scalare, mantenere o cambiare strategia.", "steps": ["Metodo consigliato: scarica i report Amazon indicati nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegali. Claude legge Shopify con il connettore e i report Amazon dai file; quando salvi il riepilogo la scheda Dati si compila da sola (controlla i valori).", "Tab Dati completa fino all'ultimo mese.", "Porta il backup nella chat e fai ricalcolare scenari e tempi.", "Decidi con Claude: scalare i canali che funzionano, tagliare gli altri."], "ok": ["Decisione scritta"]}, {"id": "R08", "ph": "R", "t": "Scansione tendenze della settimana (fatta dall'AI)", "h": 0.25, "d": ["N05"], "rep": 7, "p": 46.5, "what": "Ogni settimana l'AI cerca da sola le tendenze in salita e i contenuti già virali, le valuta con il filtro e il punteggio di potenziale virale, ne sceglie 3 adattate al tono del marchio e prepara anche i copioni della settimana. Tu non cerchi né annoti nulla.", "steps": ["Premi AI: scegli Avvia in chat (dati dai social tramite connettore) oppure Genera (solo ricerca web, un clic).", "Se hai usato la chat, incolla il riepilogo nel campo dedicato: R01 si precompila da solo.", "Leggi le 3 tendenze scelte e approva (5 minuti)."], "ok": ["3 tendenze scelte e adattate", "Copioni della settimana pronti"], "dec": "Il lavoro di ricerca è dell'AI. A te servono 5 minuti per approvare. Il metodo non garantisce la viralità: stima un potenziale con un livello di confidenza e impara dai risultati ogni settimana."}, {"id": "R01", "ph": "R", "t": "Produzione settimanale dei contenuti", "h": 6, "d": ["K05", "R08"], "rep": 7, "p": 50, "what": "3 video principali (diventano 3 Reels, 3 TikTok e 1 Shorts) + 1 post feed.", "steps": ["Scegli 3 idee dalla biblioteca di hook e dal formato vincente.", "Gira e monta in un'unica sessione.", "Sottotitoli e cover in Canva.", "Programma la settimana."], "ok": ["3 video + 1 post feed pronti e programmati"]}, {"id": "R02", "ph": "R", "t": "Pubblicazione e risposta ai commenti", "h": 3, "d": ["K05"], "rep": 7, "p": 48, "what": "Verifica che i contenuti escano e rispondi a commenti e messaggi.", "steps": ["Controlla che tutto sia stato pubblicato.", "Rispondi a commenti e messaggi entro 24 ore.", "Condividi nelle storie i contenuti migliori."], "ok": ["Pubblicazioni controllate e commenti evasi"]}, {"id": "R03", "ph": "R", "t": "Analisi settimanale dei contenuti", "h": 1, "d": ["K05"], "lag": 7, "rep": 7, "p": 52, "what": "Chi ha portato visite e ordini.", "steps": ["Visualizzazioni, condivisioni, salvataggi, clic sul profilo.", "Visite sul sito per fonte (UTM).", "Segna il contenuto migliore e il peggiore."], "ok": ["Migliore e peggiore annotati"]}, {"id": "R04", "ph": "R", "t": "Ottimizzazione settimanale Amazon Ads", "h": 2, "d": ["A05"], "rep": 7, "p": 47, "what": "Applica le regole decise sui dati della settimana.", "steps": ["Metodo consigliato: scarica il report indicato nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegalo: la chat applica le regole decise e ti dà le azioni. In alternativa incolla il testo del report in «Genera».", "Esporta il report dei termini di ricerca.", "Termine con almeno 1 vendita: aggiungilo come parola chiave esatta con offerta pari all'attuale più 10%.", "Termine con spesa oltre 8,50 € e zero vendite: aggiungilo come negativa esatta.", "Parola chiave con almeno 10 clic e ACOS oltre il target di 10 punti: offerta meno 15%.", "Parola chiave con ACOS sotto il target di 8 punti: offerta più 10%.", "Offerta massima = valore medio ordine × conversione × ACOS target. Esempio ipotetico: 34,88 € × 8% × 30% = 0,84 €.", "Una modifica per volta e annota cosa hai cambiato."], "ok": ["Report esaminato e modifiche annotate"]}, {"id": "R05", "ph": "R", "t": "Revisione KPI e inserimento dati", "h": 1, "d": ["S11"], "lag": 7, "rep": 7, "p": 49, "what": "Controlla i numeri della settimana e confrontali con lo scenario più vicino.", "steps": ["Metodo consigliato: scarica i report Amazon indicati nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegali. Claude legge Shopify con il connettore e i report Amazon dai file; quando salvi il riepilogo la scheda Dati si compila da sola (controlla i valori).", "Sessioni del sito, ordini Shopify, ordini Amazon, spesa ads.", "Inseriscili nella tab Dati.", "Guarda quale scenario stai seguendo."], "ok": ["Dati della settimana inseriti"]}, {"id": "R06", "ph": "R", "t": "Controllo scorte e riordino", "h": 0.5, "d": ["O01"], "rep": 7, "p": 53, "what": "Mai finire le magliette neutre di una taglia che vende.", "steps": ["Conta le taglie e i colori più venduti.", "Scorta minima: 2 settimane di vendite.", "Riordina."], "ok": ["Scorte controllate"]}, {"id": "R07", "ph": "R", "t": "Chiusura mese e confronto con gli scenari", "h": 1, "d": ["S11"], "lag": 28, "rep": 30, "p": 54, "what": "Fotografia mensile: fatturato, ordini, ACOS e utile stimato.", "steps": ["Metodo consigliato: scarica i report Amazon indicati nel riquadro «Come trovarlo su Amazon» (dal computer), poi tocca AI e «Avvia in chat» e allegali. Claude legge Shopify con il connettore e i report Amazon dai file; quando salvi il riepilogo la scheda Dati si compila da sola (controlla i valori).", "Compila il mese nella tab Dati.", "Confronta con pessimista, realistico e ottimista.", "Annota una decisione per il mese successivo."], "ok": ["Mese chiuso e confrontato"]}];
var DECISIONS=[["D1", "Prezzi", ["T-shirt uomo e donna a 27,90 € su Shopify e su Amazon. Cappellino 27,90 € (verifica il costo reale). Felpe 49,90 € invariate e non promosse.", "A 22,90 € con ACOS 35% perdevi circa 1,17 € per ordine. 27,90 € resta competitivo e lascia margine per promozioni. 29,90 € è rischioso: provalo solo dopo 3 mesi, con brand e contenuti forti."]], ["D2", "Ondata 1: 7 prodotti", ["4 t-shirt uomo (3 riedizioni dei bestseller storici + 1 nuovo), 2 t-shirt donna (1 riedizione + 1 nuovo), 1 cappellino (il miglior design storico).", "Le vendite storiche erano 70% uomo, 20% donna, 5% cappellini, 5% altro. Sette prodotti sono gestibili e concentrano le recensioni."]], ["D3", "Ondata 2: 4 prodotti, online entro il 15 novembre 2026", ["2 t-shirt uomo + 1 donna a tema brindisi, Natale e Capodanno + 1 design per due, da regalare, venduto anche nel bundle.", "Dicembre è il mese con stagionalità più alta (1,5): per consegnare entro Natale servono prodotti online a metà novembre."]], ["D4", "Ondata 3 e regola di catalogo", ["Si decide sui dati dopo il primo checkpoint ads: si replica ciò che vende, si archivia ciò che non vende dopo 6 settimane.", "Massimo 4 nuovi prodotti per ondata. Prodotti a stock zero o mai venduti: in bozza, non cancellati."]], ["D5", "Foto: reali per Amazon, AI per il resto", ["Stampa 7 campioni (circa 45 €) per avere foto reali su fondo bianco: l'immagine principale di Amazon deve ritrarre il prodotto vero. Controlla le linee guida attuali sulle immagini prima di caricare.", "L'AI è utile per sfondi, scene lifestyle e mockup, purché colore e stampa corrispondano al prodotto reale."]], ["D6", "Bundle e spedizione sul sito", ["2 magliette a 49,90 € (risparmio 5,90 €). Spedizione Italia 4,90 € sotto 49,90 €, gratuita da 49,90 €.", "Se i dati mostrano abbandono alla fase spedizione, prova la soglia gratuita a 39,90 €. Una modifica per volta."]], ["D7", "Amazon: struttura campagne e budget", ["Budget 250 €/mese: campagna automatica 4 €/giorno, campagna manuale 3 €/giorno, riserva test 37 €/mese. Offerte iniziali: suggerita meno 20% (auto) e meno 10% (manuale).", "Niente Sponsored Brands o Display per le prime 8 settimane."]], ["D8", "Amazon: regole di ottimizzazione settimanali", ["Termine con almeno 1 vendita: diventa parola chiave esatta (offerta +10%).", "Termine con spesa oltre 8,50 € e nessuna vendita: negativa esatta.", "Parola chiave con almeno 10 clic e ACOS oltre il target di 10 punti: offerta -15%. Con ACOS sotto il target di 8 punti: offerta +10%.", "Offerta massima = valore medio ordine × conversione × ACOS target. Esempio ipotetico: 34,88 € × 8% × 30% = 0,84 €. La conversione va misurata."]], ["D9", "Amazon: soglie ACOS per i checkpoint", ["4 settimane: fino al 35%. 8 settimane: fino al 31%. 12 settimane: fino al 28%. 24 settimane: fino al 25%.", "Break-even: circa 35% per ordine da 1 pezzo, circa 40% con 1,25 pezzi per ordine."]], ["D10", "Scalare il budget ads, e quando no", ["+50 € alla volta e solo se l'ACOS è sotto il 28% per 3 settimane di fila.", "Massimo 300 €/mese. Oltre solo con ACOS sotto il 25%. Mai raddoppiare il budget in un colpo."]], ["D11", "Contenuti: 5 pilastri", ["Il cugino (passaparola e foto clienti), Situazioni da aperitivo (sketch sarcastici), Dietro la stampa (il processo, ordine stampato in 24 ore), Frase del giorno (battuta con reveal del prodotto), Regali e occasioni.", "Tono: ironico e complice, mai volgare, mai contro qualcuno.", "Sono l'ipotesi di partenza: l'attività N05 (strategia dai dati dello studio) li conferma o li aggiorna."]], ["D12", "Contenuti: ritmo settimanale e strumenti", ["3 video principali a settimana, pubblicati come 3 Reels Instagram + 3 TikTok + 1 YouTube Shorts, più 1 post feed Instagram. Totale 7-8 contenuti.", "CapCut per montaggio e sottotitoli, Canva Pro (già ce l'hai) per cover e grafiche, Meta Business Suite e Studio nativi per programmare. Si paga solo se un tool riduce il tempo per contenuto."]], ["D13", "Meta Ads: non ora", ["Si attiva solo se il sito converte almeno 0,8% su almeno 300 sessioni. Test: 5 €/giorno per 14 giorni (70 €), costo massimo per ordine 10 €.", "Stop se dopo 100 € spesi il costo per ordine supera 16 € (margine Shopify per ordine circa 16 €)."]], ["D14", "Email, UGC e recensioni", ["Email di benvenuto con 10% sul primo ordine e recupero checkout. Dopo la consegna: richiesta di recensione e foto, con 10% sul prossimo ordine per chi invia contenuti.", "Amazon: solo il pulsante ufficiale 'Richiedi una recensione'. Nessun incentivo e nessun inserto che porti fuori da Amazon."]], ["D15", "Capacità di lavoro e ordine delle attività", ["Fase di lancio: tutto il tempo necessario. L'agenda parte con 8 ore al giorno dal lunedì al sabato, di cui 1 ora riservata agli ordini. Puoi cambiare tutto nelle Impostazioni.", "A regime le routine valgono circa 13,5 ore a settimana, in linea con le 15-20 ore che hai indicato.", "Strategia simultanea: sito, prodotti, contenuti e ads avanzano insieme, nell'ordine dettato da priorità e dipendenze."]], ["D16", "Fiscale", ["Tutte le previsioni sono al lordo di imposte e contributi. La valutazione fiscale (anche società non italiana) la fai col commercialista: l'attività T08 non blocca nulla."]], ["D18", "Limiti di caratteri Amazon (verificati il 3 ottobre 2026)", ["Titolo: massimo 75 caratteri, spazi inclusi, dal 27 luglio 2026 (prima erano 200). Nuovo campo Item Highlights (punti salienti): massimo 125 caratteri, frasi brevi separate da virgola.", "Punti elenco: 5, scrivili sotto 255 caratteri (le fonti divergono: alcune categorie accettano fino a 500). Descrizione: massimo 2.000 caratteri, solo testo. Parole chiave nascoste: massimo 249 byte (byte, non caratteri); l'app usa 200 byte come soglia di sicurezza perché oltre il limite tutto il campo viene ignorato.", "Le fonti trovate sono articoli di settore, non la documentazione ufficiale: il contatore di Seller Central per la tua categoria vale più di questa lista, controllalo sempre."]], ["D19", "Studio della nicchia: lo fa l'AI, non l'utente", ["Requisito dell'utente: non ha tempo né esperienza per cercare tendenze o osservare i social. L'AI trova tendenze e contenuti già virali, li valuta e li adatta al tono del marchio. Lo studio avviene prima dei contenuti (Fase 4): N01 mappa competitor, N02 raccolta dai social (connettore browser), N03 tendenze e calendario, N04 voce dei clienti (connettore Shopify), N05 strategia, poi R08 ogni settimana.", "Viralità: nessuno strumento può prevederla o garantirla. Il metodo la massimizza: contenuti già virali osservati nella nicchia (outlier), punteggio di potenziale con criteri espliciti, più varianti per concetto, apprendimento settimanale sui dati reali, sponsorizzazione dei vincenti solo con evidenza organica (D13).", "Tempo richiesto all'utente: circa 0,5 ore per attività più 5 minuti a settimana per approvare le 3 tendenze scelte."]], ["D20", "Raccolta dati dai social: regole e rischi", ["L'utente vuole usare il connettore browser/scraping (TinyFish) e ritiene utile la raccolta automatica. Rischio dichiarato: i termini d'uso di TikTok, Instagram e Amazon vietano la raccolta automatizzata senza autorizzazione; conseguenze possibili: blocchi tecnici (login obbligatorio, captcha) e, se si usa un account personale, sospensione di quell'account. Per i dati personali vale il GDPR.", "Regole adottate: solo pagine pubbliche, nessun login con account personali o aziendali, nessun aggiramento di captcha o blocchi (se bloccato si passa alla fonte successiva), basso volume di richieste, solo contenuti pubblici e dati aggregati, nessun dato personale conservato.", "Ordine delle fonti: strumenti pubblici (TikTok Creative Center, Google Trends), YouTube, articoli e report sul web, poi pagine pubbliche dei social tramite browser agent. Se un dato non è raggiungibile l'AI scrive 'non raggiungibile' e dice cosa ha usato al posto: non inventa mai."]], ["D17", "Cosa non fare", ["Non lanciare più di 7 prodotti all'inizio. Non cambiare prezzo o titolo dei listing ogni settimana. Non alzare il budget ads prima del checkpoint. Non usare marchi di terzi nei design. Non spendere in Meta Ads prima di avere conversioni reali sul sito."]]];

      if(e&&e.name==='AbortError'){if(o&&AITEXT)o.innerHTML=renderOut(AITEXT,id)+'<p class="mut small">Interrotto.</p>';else{var w2=$('#ai-wrap');if(w2)w2.hidden=true}if(a)a.innerHTML='';save();return}
      save();
      var msg=(e instanceof TypeError)?'Connessione non riuscita. Controlla la rete o eventuali blocchi del browser.':e.message;
      if(o)o.innerHTML='<p class="err">'+esc(msg)+'</p>';if(a)a.innerHTML=''})}
function keyTest(){

  else if(act==='import')$('#imp').click();

  else if(act==='gnext'){var s6=S.ai[id]=S.ai[id]||{vals:{},msgs:[]};s6.gstep=+a.getAttribute('data-n');save();paintGuide(id)}
  else if(act==='ai-sum'){var sm=($('#ai-sum')||{}).value;sm=(sm||'').trim();if(!sm){toast('Incolla prima il riepilogo');return}var s4=S.ai[id]=S.ai[id]||{vals:{},msgs:[]};s4.msgs=[{role:'user',content:'(riepilogo ricevuto dalla chat)'},{role:'assistant',content:sm}];s4.sumAt=today();s4.gstep=5;s4.sumWords=sm.split(/\s+/).length;s4.sumWarn=(sm.length<300||!/RIEPILOGO/i.test(sm));var kp2=parseKpi(sm);s4.kpiMonths=kp2.map(function(x){return x.m});kp2.forEach(function(x){S.kpi[x.m]=Object.assign(S.kpi[x.m]||{},x.f)});save();toast(s4.sumWarn?'Salvato, ma controlla che sia il messaggio giusto':(kp2.length?'Riepilogo salvato e scheda Dati aggiornata':'Riepilogo salvato'));openAI(id)}
  else if(act==='gh-cfg'){var qv=function(k){var e=document.querySelector('[data-gh="'+k+'"]');return e?e.value.trim():''};var oc=ghRaw();var nc={device:qv('device')||devGuess(),owner:qv('owner'),repo:qv('repo'),branch:qv('branch')||'main',path:(qv('path')||'relaunch-mmnds-backup.json').replace(/^\/+/,''),token:qv('token')||oc.token||'',auto:oc.auto!==false,last:oc.last||null};if(!nc.owner||!nc.repo||!nc.token){toast('Compila nome utente, repository e token');return}if(oc.owner===nc.owner&&oc.repo===nc.repo&&(oc.path||'')===(nc.path||'')){nc.base=oc.base;nc.sha=oc.sha;nc.pushAt=oc.pushAt}ghSet(nc);GH.err=null;GH.conflict=null;GH.ok=null;paintGhStat();paintSync();ghSync('manual')}
  else if(act==='sync-now'||act==='gh-now'){ghSync('manual')}
  else if(act==='sync-keep'){GH.conflict=null;repaintAlerts();ghSync('keep')}
  else if(act==='sync-take'){var cf2=GH.conflict;if(cf2){discardLocal();GH.conflict=null;ghApply(cf2.rd,cf2.rs);var cs=ghRaw();cs.sha=cf2.sha;ghSet(cs);repaintAlerts();paintSync();paintGhStat()}}
  else if(act==='gh-restore'){if(window.confirm('Sostituire i dati di questo dispositivo con la copia salvata su GitHub? La copia attuale resta salvata sul dispositivo.'))ghGet().then(function(g){if(!g.exists){toast('Su GitHub non c\'è ancora nessuna copia');return}discardLocal();ghApply(g.data,(g.data.ui&&g.data.ui.savedAt!==undefined)?g.data.ui.savedAt:null);var cs2=ghRaw();cs2.sha=g.sha;ghSet(cs2);GH.conflict=null;repaintAlerts();paintSync();paintGhStat()}).catch(function(e){toast(e.message||'Ripristino non riuscito')})}
  else if(act==='disc-restore'){var dd=null;try{dd=JSON.parse(localStorage.getItem(DISC)||'null')}catch(e){}if(dd&&dd.state&&window.confirm('Riportare su questo dispositivo la copia scartata? Diventa la copia attuale e verrà salvata su GitHub alla prossima sincronizzazione.')){S=norm(dd.state);SIM=null;try{localStorage.removeItem(DISC)}catch(e){}save();render();toast('Copia scartata ripristinata')}}

  else if(act==='ai-copyf'){copyText(AIFIELDS[+a.getAttribute('data-i')]||'','Campo copiato');flash(a)}

  else if(act==='amz-help'){var hp=amzHelpPrompt(id);if(!hp)return;copyText(hp,'Richiesta copiata: incollala in una chat con Claude e completa la riga «Cosa vedo»');window.open('https://claude.ai/new','_blank','noopener')}
  else if(act==='conn'||act==='reconn'){copyText(CONNP[act],'Procedura copiata: incollala nella nuova chat di Claude');window.open('https://claude.ai/new','_blank','noopener')}
  else if(act==='ai-save'){var sa=lastAssistant(S.ai[id]||{});if(sa){var s3=ts(id);s3.note=(s3.note?s3.note+'\n\n':'')+'--- AI '+today()+' ---\n'+cleanText(sa);save();toast('Salvata nella nota del task')}}
  else if(act==='ai-reset'){S.ai[id]={vals:(S.ai[id]||{}).vals||{},msgs:[]};save();openAI(id)}
  else if(act==='keysave'){var kv=$('#keyin').value.trim();if(!kv){toast('Incolla prima la chiave');return}setKey(kv,$('#keyrem').checked);render(true);toast('Chiave salvata')}
  else if(act==='keydel'){setKey('');render(true);toast('Chiave rimossa')}
  else if(act==='keytest')keyTest();
  else if(act==='reset'){if(window.confirm('Azzerare tutti i dati di questa agenda? L\'operazione non si può annullare.')){S=norm(null);SIM=null;save();render();toast('Agenda azzerata')}}
});
document.addEventListener('change',function(ev){
  var el=ev.target;

  var cn=el.getAttribute&&el.getAttribute('data-conn');if(cn){S.settings.conn[cn]=el.checked;save();render(true);toast(el.checked?'Segnato come collegato':'Segnato come non collegato');return}
  var dy=el.getAttribute&&el.getAttribute('data-day');if(dy!==null&&dy!==undefined&&el.type==='checkbox'&&el.hasAttribute('data-day')){var d=+dy,ix=S.settings.days.indexOf(d);if(el.checked&&ix<0)S.settings.days.push(d);if(!el.checked&&ix>=0)S.settings.days.splice(ix,1);SIM=null;save();render(true);toast('Piano ricalcolato')}
});
