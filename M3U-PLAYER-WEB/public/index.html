<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Canali TV</title>
  <!-- Installabile sulla schermata Home: si apre come un'app, senza barre del browser -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Canali TV">
  <meta name="theme-color" content="#090a1c">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
  <script src="theme.js"></script>
</head>
<body>
  <nav class="dock" aria-label="Filtri">
    <input id="search" type="search" placeholder="Cerca canale…" aria-label="Cerca canale">
    <select id="group" aria-label="Gruppo"><option value="">Tutti i gruppi</option></select>
    <label class="chk"><input id="itOnly" type="checkbox"> Italiani (DTT)</label>
    <select id="theme" aria-label="Aspetto" title="Aspetto">
      <option value="notte">Notte</option>
      <option value="televideo">Televideo</option>
      <option value="vetrina">Vetrina</option>
      <option value="carta">Carta</option>
      <option value="aurora">Aurora</option>
    </select>
  </nav>

  <main>
    <p id="count" class="muted" role="status">Caricamento…</p>
    <ol id="channels"></ol>
    <button id="more" class="btn" hidden>Mostra altri</button>
  </main>

  <footer><a href="admin">Amministrazione</a></footer>

  <div id="player" hidden>
    <video id="video" controls autoplay playsinline></video>
    <div id="bar">
      <button id="prev" class="btn" aria-label="Canale precedente (freccia sinistra)" title="Canale precedente (←)">&#9664;</button>
      <span id="title"></span>
      <button id="alt" class="btn" hidden aria-label="Prova un'altra fonte" title="Altra fonte">&#8635;</button>
      <button id="next" class="btn" aria-label="Canale successivo (freccia destra)" title="Canale successivo (→)">&#9654;</button>
      <button id="fsBtn" class="btn" hidden aria-label="Schermo intero" title="Schermo intero">&#9974;</button>
      <button id="infoBtn" class="btn" aria-label="Diagnosi (tasto I)" title="Diagnosi (I)">i</button>
      <button id="close" class="btn" aria-label="Chiudi">&#10005;</button>
    </div>
    <pre id="info" hidden></pre>
    <p id="msg" role="status"></p>
    <p id="streamUrl" hidden></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
  <script src="m3u.js"></script>
  <script src="dtt-it.js"></script>
  <script src="app.js"></script>
</body>
</html>
