# Cloudflare Workers: pagina + area admin su tv.vannini.online (vedi ../DEPLOY-CLOUDFLARE.md)
name = "tv-vannini"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# Collega il Worker al sottodominio (il dominio sta nel tuo account Cloudflare).
# Va scritto PRIMA delle sezioni [..], altrimenti TOML lo assegna alla sezione precedente e wrangler lo ignora.
routes = [{ pattern = "tv.vannini.online", custom_domain = true }]

# La pagina (cartella public/) e' servita dal Worker, che aggiunge intestazioni di sicurezza e le API.
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

# Archivio per playlist, elenco delle fonti e copie.
[[kv_namespaces]]
binding = "DATA"
id = "f6599f26a4ac4cacbe1d7a3ffd6dd54d"

# Riaggiorna le liste da sole ogni 6 ore.
[triggers]
crons = ["0 */6 * * *"]
