# Cloudflare Workers: pagina + area admin su tv.vannini.online (vedi DEPLOY-CLOUDFLARE.md)
name = "tv-vannini"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# La pagina (cartella public/) e' servita dal Worker, che aggiunge intestazioni di sicurezza e le API.
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

# Archivio per playlist, elenco delle fonti e copie: crealo con `npx wrangler kv namespace create DATA`
# e incolla qui l'id che stampa.
[[kv_namespaces]]
binding = "DATA"
id = "INSERISCI_QUI_L_ID_DEL_KV"

# Collega il Worker al sottodominio (il dominio deve stare nel tuo account Cloudflare).
routes = [{ pattern = "tv.vannini.online", custom_domain = true }]

# Riaggiorna le liste da sole ogni 6 ore.
[triggers]
crons = ["0 */6 * * *"]
