plugins {
    id 'com.android.application'
}

android {
    namespace 'online.vannini.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'online.vannini.tv'
        minSdk 22
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    // Chiave fissa (nel repository): ogni nuova versione si installa sopra la precedente senza cancellare l'app.
    signingConfigs {
        release {
            storeFile file('tv-vannini.keystore')
            storePassword 'tv-vannini'
            keyAlias 'tv-vannini'
            keyPassword 'tv-vannini'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
}
