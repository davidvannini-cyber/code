<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player M3U</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Player M3U</h1>
    <div class="load">
      <label class="btn">Apri file<input id="file" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl" hidden></label>
      <input id="urlInput" type="url" placeholder="URL della playlist (https://…)" aria-label="URL della playlist">
      <button id="urlBtn" class="btn">Carica URL</button>
      <button id="sampleBtn" class="btn ghost">Esempio</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <video id="video" controls playsinline></video>
      <p id="status" role="status">Carica una playlist per iniziare.</p>
      <details>
        <summary>Incolla il testo della playlist</summary>
        <textarea id="paste" rows="5" placeholder="#EXTM3U&#10;#EXTINF:-1,Nome canale&#10;https://…/stream.m3u8"></textarea>
        <button id="pasteBtn" class="btn">Carica testo</button>
      </details>
    </section>

    <section class="list">
      <div class="filters">
        <input id="search" type="search" placeholder="Cerca canale…" aria-label="Cerca canale">
        <select id="group" aria-label="Gruppo"><option value="">Tutti i gruppi</option></select>
      </div>
      <p id="count" class="muted"></p>
      <ul id="channels"></ul>
      <button id="more" class="btn ghost" hidden>Mostra altri</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script src="m3u.js"></script>
  <script src="app.js"></script>
</body>
</html>
