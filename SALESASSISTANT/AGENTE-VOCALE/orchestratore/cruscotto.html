<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agente vocale</title>
<style>
:root{--bg:#f4f6fa;--fg:#1a1f2e;--card:#fff;--line:#d6dbe6;--ok:#0f9d8a;--warn:#b45309;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--fg:#e8ecf4;--card:#1a202c;--line:#2e3748}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:18px;margin:0 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.stato{font-size:22px;font-weight:700}.big{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:12px 16px;cursor:pointer;background:var(--line);color:var(--fg)}
button.ok{background:var(--ok);color:#fff}button.no{background:var(--bad);color:#fff}button.w{background:var(--warn);color:#fff}
pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;margin:0;max-height:220px;overflow:auto}
.passa{border:3px solid var(--warn);display:none}
</style></head><body>
<h1>Agente vocale · cruscotto</h1>
<div class="card"><div class="stato" id="stato">…</div><div id="chi"></div><div id="audio" style="font-size:12px;opacity:.7"></div>
<div class="big">
<button class="w" onclick="az('risposto')">Ha risposto (a mano)</button>
<button onclick="az('segreteria')">Segreteria</button>
<button class="no" onclick="az('termina')">Termina</button></div></div>
<div class="card passa" id="passa"><b>Richiesta di passaggio</b><div id="motivo" style="margin:6px 0"></div>
<div class="big"><button class="ok" onclick="az('ci-sono')">Ci sono</button><button class="no" onclick="az('non-posso')">Non posso</button></div></div>
<div class="card"><b>Conversazione</b><pre id="testo"></pre></div>
<div class="card"><b>Eventi</b><pre id="log"></pre></div>
<script>
const T=new URLSearchParams(location.search).get('t')||'';
async function az(p){try{await fetch('/'+p,{method:'POST',headers:{'X-YM-Token':T,'Content-Type':'application/json'},body:'{}'})}catch(e){}}
let ultimoPassaggio=false;
async function giro(){
 try{const r=await fetch('/stato',{headers:{'X-YM-Token':T}});const s=await r.json();
  document.getElementById('stato').textContent=s.stato;
  document.getElementById('chi').textContent=s.nome?(s.nome+' · '+s.telefono+' · '+s.secondi+' s'):'';
  document.getElementById('audio').textContent='audio: '+s.audio.modo+' · livello telefono '+s.audio.picco_telefono;
  document.getElementById('testo').textContent=(s.testo||[]).join('\n');
  document.getElementById('log').textContent=(s.log||[]).join('\n');
  const att=s.stato==='HANDOFF_WAITING';document.getElementById('passa').style.display=att?'block':'none';
  if(att){document.getElementById('motivo').textContent=(s.passaggio.summary||s.passaggio.reason||'');
   if(!ultimoPassaggio)try{new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play()}catch(e){}}
  ultimoPassaggio=att;
 }catch(e){document.getElementById('stato').textContent='Servizio non raggiungibile'}
}
setInterval(giro,1000);giro();
</script></body></html>
