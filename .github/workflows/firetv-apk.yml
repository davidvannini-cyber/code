name: Fire TV APK

# Costruisce l'app per Fire TV (M3U-PLAYER-WEB/firetv) e la pubblica come file scaricabile.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'M3U-PLAYER-WEB/firetv/**'
      - '.github/workflows/firetv-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Costruisci l'APK
        working-directory: M3U-PLAYER-WEB/firetv
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rinomina il file
        run: cp M3U-PLAYER-WEB/firetv/app/build/outputs/apk/release/app-release.apk tv-vannini.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-vannini-apk
          path: tv-vannini.apk

      - name: Pubblica il file scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete firetv-latest --cleanup-tag --yes || true
          gh release create firetv-latest tv-vannini.apk \
            --target "$GITHUB_SHA" \
            --title "TV Vannini per Fire TV" \
            --notes "Ultima versione dell'app per Fire TV (costruita da $GITHUB_SHA). Istruzioni: M3U-PLAYER-WEB/firetv/FIRETV.md"
