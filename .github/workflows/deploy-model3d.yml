name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MODEL3D/package-lock.json

      - name: Install dependencies
        working-directory: MODEL3D
        run: npm ci

      - name: Build
        working-directory: MODEL3D
        run: npm run build

      # The site is the whole repository (as before, when Pages published the
      # branch), with MODEL3D replaced by its built app. Publishing only
      # MODEL3D/dist would wipe every other folder from the site.
      - name: Assemble site
        run: |
          mkdir _site
          tar -cf - --exclude='./_site' --exclude='./.git' --exclude='./.github' --exclude='./.claude' --exclude='./MODEL3D' --exclude='node_modules' . | tar -xf - -C _site
          mkdir -p _site/MODEL3D
          cp -a MODEL3D/dist/. _site/MODEL3D/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
