name: BlackBox prova

# Prova: costruisce una mini app che usa il motore di BlackBox 2.1.0 (Apache-2.0) per vedere se WhatsApp
# parte dentro il contenitore su Android 16. Il codice di BlackBox sta nella release "blackbox-sorgenti".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blackbox-prova.yml'
      - 'BLACKBOX-PROVA/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Scarica il codice di BlackBox
        run: |
          curl -sSL -o bb.zip https://github.com/davidvannini-cyber/code/releases/download/blackbox-sorgenti/BlackBox-2.1.0.zip
          unzip -q bb.zip

      - name: Sostituisci l'app dimostrativa con la nostra mini app
        working-directory: BlackBox-2.1.0
        run: |
          sed -i "/include ':app'/d" settings.gradle
          echo "include ':prova'" >> settings.gradle
          cp -r ../BLACKBOX-PROVA/prova ./prova
          cat settings.gradle

      - name: Accetta le licenze Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Costruisci
        working-directory: BlackBox-2.1.0
        run: |
          chmod +x gradlew
          ./gradlew :prova:assembleDebug --no-daemon --stacktrace

      - name: Raccogli l'APK
        run: |
          find BlackBox-2.1.0/prova -name "*.apk"
          cp "$(find BlackBox-2.1.0/prova -name '*.apk' | head -1)" blackbox-prova.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-prova-apk
          path: blackbox-prova.apk

      - name: Pubblica il file scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete blackbox-prova-latest --cleanup-tag --yes || true
          gh release create blackbox-prova-latest blackbox-prova.apk \
            --target "$GITHUB_SHA" \
            --title "BlackBox prova" \
            --notes "Prova di BlackBox 2.1.0 (Apache-2.0), costruita da $GITHUB_SHA."
