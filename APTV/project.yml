# Genera APTV.xcodeproj con XcodeGen:  brew install xcodegen && xcodegen generate
name: APTV
options:
  bundleIdPrefix: com.davidvannini
  deploymentTarget:
    iOS: "17.0"
packages:
  APTVCore:
    path: .
targets:
  APTV:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: APTVCore
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.davidvannini.aptv
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: APTV
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoads: true
