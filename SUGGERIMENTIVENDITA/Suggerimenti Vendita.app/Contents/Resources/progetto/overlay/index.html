<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Suggerimenti Live</title>
<style>
  :root {
    --colore-apertura: #3b82f6;
    --colore-scoperta: #14b8a6;
    --colore-presentazione: #8b5cf6;
    --colore-obiezioni: #f59e0b;
    --colore-chiusura: #22c55e;
    --colore-default: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #0f1115;
    color: #f3f4f6;
    padding: 16px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #stato-connessione {
    position: fixed;
    top: 10px;
    right: 16px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: #374151;
  }
  #stato-connessione.connesso { background: #14532d; }
  #stato-connessione.disconnesso { background: #7f1d1d; }

  .riquadro-logo {
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }
  .riquadro-logo img {
    height: 83px;
    width: auto;
    opacity: .95;
  }

  .riquadro-microfono {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
  }
  #selettore-microfono {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #1b1e26;
    color: #f3f4f6;
    max-width: 260px;
  }
  #selettore-microfono:disabled {
    opacity: .6;
  }
  #pulsante-microfono, #pulsante-pausa, #pulsante-termina {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 30px;
    border-radius: 14px;
    cursor: pointer;
  }
  #pulsante-microfono {
    border: none;
    background: #f59e0b;
    color: #1c1300;
  }
  #pulsante-microfono.attivo {
    background: #14532d;
    color: #f3f4f6;
    cursor: default;
  }
  #pulsante-microfono:disabled {
    opacity: .6;
    cursor: default;
  }
  #pulsante-pausa {
    border: 1px solid #374151;
    background: #1b1e26;
    color: #f3f4f6;
  }
  #pulsante-pausa.in-pausa {
    background: #7c2d12;
    border-color: #f59e0b;
  }
  #pulsante-termina {
    border: 1px solid #7f1d1d;
    background: #450a0a;
    color: #fecaca;
  }

  .riquadro {
    background: #1b1e26;
    border-radius: 12px;
    padding: 12px 18px;
  }

  .riquadro-livello {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 18px;
    font-size: 12px;
    color: #9ca3af;
  }
  .barra-livello-track {
    flex: 1;
    max-width: 280px;
    height: 7px;
    border-radius: 4px;
    background: #0f1115;
    border: 1px solid #374151;
    overflow: hidden;
  }
  .barra-livello-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: #4b5563;
    transition: width .08s linear, background-color .15s linear;
  }
  .barra-livello-fill.livello-buono { background: #22c55e; }
  .barra-livello-fill.livello-medio { background: #f59e0b; }
  .barra-livello-fill.livello-alto { background: #ef4444; }

  #lead-info {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 8px;
    font-size: 14px;
    color: #9ca3af;
  }
  #lead-info b { color: #f3f4f6; font-weight: 600; }
  #lead-info .separatore { color: #4b5563; }

  /* Canovaccio "Rinforzo Facile Salire": riquadro a parte, sempre visibile
     per tutta la chiamata (non si sovrascrive con i suggerimenti dal vivo
     qui sotto, che restano attivi come nel flusso standard). Compare solo
     se il server manda un messaggio "canovaccio" (solo in questa modalità). */
  #riquadro-canovaccio {
    border: 1px solid #14532d;
    background: #0f2417;
    flex-shrink: 0;
  }
  .etichetta-canovaccio {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #4ade80;
    margin-bottom: 8px;
  }
  #canovaccio-testo {
    font-size: 19px;
    line-height: 1.5;
    color: #e5e7eb;
  }
  #canovaccio-testo p {
    margin: 0 0 8px;
  }
  #canovaccio-testo p:last-child {
    margin-bottom: 0;
  }

  #fase-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--colore-default);
    margin-bottom: 12px;
  }

  #suggerimento-principale {
    font-size: 30px;
    line-height: 1.35;
    font-weight: 600;
    min-height: 90px;
  }

  #suggerimento-alternativo {
    margin-top: 10px;
    font-size: 17px;
    color: #a5b4fc;
    min-height: 24px;
  }
  #suggerimento-alternativo:before {
    content: "Alternativa: ";
    color: #6b7280;
  }

  .riquadro-trascrizioni {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .etichetta-trascrizioni {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  #trascrizioni {
    flex: 1;
    overflow-y: auto;
    font-size: 14px;
    color: #9ca3af;
  }
  #trascrizioni .riga {
    padding: 4px 0;
    border-bottom: 1px solid #262a33;
  }
  #trascrizioni .riga:last-child {
    color: #e5e7eb;
    font-weight: 500;
  }

  .footer-copyright {
    text-align: center;
    font-size: 11px;
    color: #4b5563;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <div id="stato-connessione" class="disconnesso">disconnesso</div>

  <div class="riquadro-logo">
    <img src="logo-yesmobility.png" alt="YesMobility" onerror="this.parentElement.remove()">
  </div>

  <div class="riquadro riquadro-microfono">
    <select id="selettore-microfono" title="Dispositivo audio in ingresso"></select>
    <button id="pulsante-microfono">🎙️ Avvia microfono</button>
    <button id="pulsante-pausa" style="display:none;">⏸ Pausa</button>
    <button id="pulsante-termina" style="display:none;">🛑 Termina chiamata</button>
  </div>

  <div class="riquadro-livello" id="riquadro-livello">
    <span>Segnale in ingresso</span>
    <div class="barra-livello-track"><div class="barra-livello-fill" id="livello-fill"></div></div>
  </div>

  <div class="riquadro" id="lead-info">
    <span>Nome: <b id="lead-nome">—</b></span>
    <span class="separatore">·</span>
    <span>Numero di telefono: <b id="lead-telefono">—</b></span>
  </div>

  <div class="riquadro" id="riquadro-canovaccio" style="display:none;">
    <div class="etichetta-canovaccio">Canovaccio chiamata</div>
    <div id="canovaccio-testo"></div>
  </div>

  <div class="riquadro">
    <div id="fase-badge">in attesa</div>
    <div id="suggerimento-principale">In attesa del primo suggerimento…</div>
    <div id="suggerimento-alternativo" style="display:none;"></div>
  </div>

  <div class="riquadro riquadro-trascrizioni">
    <div class="etichetta-trascrizioni">Frasi del cliente — solo la sua voce viene trascritta, non è una conversazione</div>
    <div id="trascrizioni"></div>
  </div>

  <div class="footer-copyright">© Designed and krafted by Momandis David Vannini</div>

<script>
  const COLORI_FASE = {
    apertura: "var(--colore-apertura)",
    scoperta: "var(--colore-scoperta)",
    presentazione: "var(--colore-presentazione)",
    obiezioni: "var(--colore-obiezioni)",
    chiusura: "var(--colore-chiusura)",
  };

  const elStato = document.getElementById("stato-connessione");
  const elFaseBadge = document.getElementById("fase-badge");
  const elPrincipale = document.getElementById("suggerimento-principale");
  const elAlternativo = document.getElementById("suggerimento-alternativo");
  const elTrascrizioni = document.getElementById("trascrizioni");
  const elLeadNome = document.getElementById("lead-nome");
  const elLeadTelefono = document.getElementById("lead-telefono");
  const elBottoneMic = document.getElementById("pulsante-microfono");
  const elBottonePausa = document.getElementById("pulsante-pausa");
  const elBottoneTermina = document.getElementById("pulsante-termina");
  const elSelettoreMic = document.getElementById("selettore-microfono");
  const elRiquadroLivello = document.getElementById("riquadro-livello");
  const elLivelloFill = document.getElementById("livello-fill");

  let wsCorrente = null;
  let microfonoInPausa = false;
  let chiamataTerminata = false;
  let streamCorrente = null;

  // ---------- Scelta del dispositivo audio in ingresso --------------------
  //
  // Senza questo selettore, getUserMedia cattura sempre il dispositivo di
  // ingresso di DEFAULT del sistema/browser: se il connettore esterno (es.
  // un'interfaccia che porta l'audio della telefonata nel Mac) non è quello
  // predefinito, il motore di suggerimento continua ad ascoltare il
  // microfono integrato senza che ce ne sia evidenza visibile. La pagina è
  // aperta in modalità "app" (niente barra indirizzi), quindi l'operatore
  // non può scegliere il dispositivo dalle impostazioni del sito in Chrome:
  // la scelta va offerta qui, direttamente nella pagina.
  const CHIAVE_DISPOSITIVO = "suggerimentivendita_deviceId_microfono";
  let dispositivoSelezionato = localStorage.getItem(CHIAVE_DISPOSITIVO) || "";

  async function popolaDispositiviAudio() {
    try {
      const dispositivi = await navigator.mediaDevices.enumerateDevices();
      const ingressi = dispositivi.filter((d) => d.kind === "audioinput");
      if (ingressi.length === 0) return;
      const valorePrecedente = elSelettoreMic.value || dispositivoSelezionato;
      elSelettoreMic.innerHTML = "";
      // Opzione sempre presente, prima della lista: nessun vincolo di
      // deviceId passato a getUserMedia, segue quindi la sorgente che macOS
      // considera di volta in volta predefinita (compreso lo switch
      // automatico sul jack quando ci si collega/scollega qualcosa) — è il
      // comportamento che c'era PRIMA di questo selettore. Senza questa
      // opzione esplicita, la prima volta che la pagina si apre senza una
      // scelta salvata finiva per agganciarsi comunque al primo dispositivo
      // dell'elenco (spesso il microfono integrato), perdendo lo switch
      // automatico e restando bloccata lì anche alle chiamate successive.
      const opzionePredefinita = document.createElement("option");
      opzionePredefinita.value = "";
      opzionePredefinita.textContent = "Predefinito di sistema (segue il Mac)";
      elSelettoreMic.appendChild(opzionePredefinita);
      ingressi.forEach((d, indice) => {
        const opzione = document.createElement("option");
        opzione.value = d.deviceId;
        opzione.textContent = d.label || `Ingresso audio ${indice + 1}`;
        elSelettoreMic.appendChild(opzione);
      });
      const trovato = valorePrecedente === "" || ingressi.some((d) => d.deviceId === valorePrecedente);
      elSelettoreMic.value = trovato ? valorePrecedente : "";
      dispositivoSelezionato = elSelettoreMic.value;
    } catch (errore) {
      // enumerateDevices prima di un primo permesso concesso può fallire o
      // restituire etichette vuote: non è un errore da mostrare, la lista
      // si aggiorna da sola dopo il primo avvio riuscito del microfono.
    }
  }

  function fermaMicrofono() {
    if (contestoAudio) { contestoAudio.close(); contestoAudio = null; }
    if (streamCorrente) { streamCorrente.getTracks().forEach((t) => t.stop()); streamCorrente = null; }
    elRiquadroLivello.style.display = "none";
    elLivelloFill.style.width = "0%";
    elLivelloFill.className = "barra-livello-fill";
    livelloSmussato = 0;
  }

  // ---------- Spia del livello di segnale in ingresso ----------------------
  //
  // Serve solo a capire a colpo d'occhio se qualcosa sta davvero arrivando
  // dal dispositivo scelto (utile per diagnosticare un jack/splitter che non
  // porta il segnale, senza dover aprire le Preferenze di Sistema): non è
  // legata all'invio dei suggerimenti, resta attiva anche durante la pausa.
  let livelloSmussato = 0;
  function aggiornaLivelloMicrofono(campioni) {
    let picco = 0;
    for (let i = 0; i < campioni.length; i++) {
      const v = Math.abs(campioni[i]);
      if (v > picco) picco = v;
    }
    // Salita immediata, discesa morbida: altrimenti col parlato normale la
    // barra lampeggerebbe in modo illeggibile invece di restare leggibile.
    livelloSmussato = picco > livelloSmussato ? picco : livelloSmussato * 0.85;
    elLivelloFill.style.width = Math.min(100, Math.round(livelloSmussato * 140)) + "%";
    let classe = "";
    if (livelloSmussato >= 0.55) classe = "livello-alto";
    else if (livelloSmussato >= 0.2) classe = "livello-medio";
    else if (livelloSmussato >= 0.02) classe = "livello-buono";
    elLivelloFill.className = "barra-livello-fill " + classe;
  }

  elSelettoreMic.addEventListener("change", async () => {
    dispositivoSelezionato = elSelettoreMic.value;
    localStorage.setItem(CHIAVE_DISPOSITIVO, dispositivoSelezionato);
    if (chiamataTerminata) return;
    // Cambio dispositivo "a caldo": ferma la cattura corrente e riavvia
    // subito con il nuovo ingresso, senza toccare la connessione WebSocket
    // (i suggerimenti restano attivi durante il cambio).
    fermaMicrofono();
    elBottoneMic.classList.remove("attivo");
    await avviaMicrofono(false);
  });

  if (navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener("devicechange", popolaDispositiviAudio);
  }
  popolaDispositiviAudio();

  // ---------- Cattura microfono dal browser -------------------------------
  //
  // Il permesso del microfono lo chiede il BROWSER (Safari/Chrome), non la
  // nostra app: niente problemi di firma/permessi di sistema. L'audio
  // catturato viene ricampionato a 16kHz mono (formato atteso da Deepgram)
  // e mandato come frame binari sullo stesso WebSocket già usato per
  // ricevere i suggerimenti — il server lo inoltra a Deepgram al posto del
  // microfono via Python.
  const SAMPLE_RATE_DEEPGRAM = 16000;
  let contestoAudio = null;

  function ricampiona(input, tassoOriginale, tassoDestinazione) {
    if (tassoOriginale === tassoDestinazione) return input;
    const rapporto = tassoOriginale / tassoDestinazione;
    const lunghezzaOutput = Math.floor(input.length / rapporto);
    const output = new Float32Array(lunghezzaOutput);
    for (let i = 0; i < lunghezzaOutput; i++) {
      const posizione = i * rapporto;
      const indice = Math.floor(posizione);
      const frazione = posizione - indice;
      const campioneA = input[indice] || 0;
      const campioneB = input[indice + 1] !== undefined ? input[indice + 1] : campioneA;
      output[i] = campioneA + (campioneB - campioneA) * frazione;
    }
    return output;
  }

  function float32AInt16(input) {
    const output = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      output[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return output;
  }

  async function avviaMicrofono(automatico) {
    elBottoneMic.disabled = true;
    elBottoneMic.textContent = "Richiedo permesso…";
    let stream = null;
    try {
      // autoGainControl chiesto esplicitamente: normalizza già a livello di
      // sistema operativo un segnale "caldo" come quello in uscita da un
      // telefono (pensato per un altoparlante, non per un microfono) — si
      // affianca al limiter software più sotto (DynamicsCompressorNode),
      // che interviene sui picchi residui che l'AGC del sistema non copre.
      const vincoliBase = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
      const vincoliAudio = dispositivoSelezionato
        ? Object.assign({ deviceId: { exact: dispositivoSelezionato } }, vincoliBase)
        : vincoliBase;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: vincoliAudio });
      } catch (erroreDispositivo) {
        // Il dispositivo salvato potrebbe non essere più disponibile (es.
        // connettore scollegato): non blocchiamo l'avvio, ripieghiamo sul
        // default e lasciamo che l'operatore scelga di nuovo dalla lista.
        if (dispositivoSelezionato) {
          dispositivoSelezionato = "";
          stream = await navigator.mediaDevices.getUserMedia({ audio: vincoliBase });
        } else {
          throw erroreDispositivo;
        }
      }
      streamCorrente = stream;
      popolaDispositiviAudio();
      contestoAudio = new (window.AudioContext || window.webkitAudioContext)();

      // I browser sospendono automaticamente ogni AudioContext creato senza
      // un gesto utente diretto (policy anti-autoplay): getUserMedia può
      // riuscire comunque (se il permesso era già stato concesso in
      // passato), dando l'illusione che il microfono sia attivo mentre in
      // realtà onaudioprocess non scatta mai e non parte nessun byte verso
      // il server. Va quindi verificato esplicitamente lo stato del
      // contesto, non solo che getUserMedia sia andato a buon fine.
      if (contestoAudio.state === "suspended") {
        await contestoAudio.resume().catch(() => {});
      }
      if (contestoAudio.state !== "running") {
        throw Object.assign(new Error("Il browser ha bloccato l'avvio automatico dell'audio."), { sospeso: true });
      }

      const sorgente = contestoAudio.createMediaStreamSource(stream);

      // Limiter software: appiattisce i picchi residui che l'autoGainControl
      // del sistema non riesce a coprire (tipico con un segnale "di linea"
      // come l'uscita di un telefono, più caldo di un microfono normale).
      // Agisce sia su ciò che vede la spia di livello sia su ciò che viene
      // trascritto, riducendo il rischio di saturazione senza appiattire
      // troppo la voce (soglia e ratio tarati come un limiter morbido, non
      // una compressione pesante).
      const compressore = contestoAudio.createDynamicsCompressor();
      compressore.threshold.value = -24;
      compressore.knee.value = 12;
      compressore.ratio.value = 12;
      compressore.attack.value = 0.003;
      compressore.release.value = 0.25;

      const nodoScript = contestoAudio.createScriptProcessor(4096, 1, 1);
      const silenzio = contestoAudio.createGain();
      silenzio.gain.value = 0; // non far sentire in altoparlante quello che cattura

      nodoScript.onaudioprocess = (evento) => {
        const campioni = evento.inputBuffer.getChannelData(0);
        aggiornaLivelloMicrofono(campioni);
        if (microfonoInPausa) return;
        if (!wsCorrente || wsCorrente.readyState !== WebSocket.OPEN) return;
        const ridotti = ricampiona(campioni, contestoAudio.sampleRate, SAMPLE_RATE_DEEPGRAM);
        const pcm16 = float32AInt16(ridotti);
        wsCorrente.send(pcm16.buffer);
      };

      sorgente.connect(compressore);
      compressore.connect(nodoScript);
      nodoScript.connect(silenzio);
      silenzio.connect(contestoAudio.destination);

      elRiquadroLivello.style.display = "flex";
      elBottoneMic.textContent = "🎙️ Microfono attivo";
      elBottoneMic.classList.add("attivo");
      elBottonePausa.style.display = "inline-block";
      elBottoneTermina.style.display = "inline-block";
    } catch (errore) {
      elBottoneMic.disabled = false;
      elBottoneMic.textContent = "🎙️ Avvia microfono";
      if (stream) stream.getTracks().forEach((traccia) => traccia.stop());
      streamCorrente = null;
      if (contestoAudio) { contestoAudio.close(); contestoAudio = null; }
      elRiquadroLivello.style.display = "none";
      // Il primo tentativo è automatico, alla sola apertura della pagina: se
      // il permesso non è ancora stato concesso, o il browser ha sospeso il
      // contesto audio perché manca un gesto utente, i browser bloccano il
      // tentativo senza un click umano — è normale, non un errore da
      // mostrare. Un errore vero lo mostriamo solo dopo un click esplicito
      // (che è un gesto utente valido, quindi qui l'avvio dovrebbe riuscire).
      if (!automatico) {
        elPrincipale.textContent = errore.sospeso
          ? "Il browser ha bloccato l'avvio del microfono: clicca di nuovo \"Avvia microfono\"."
          : "Permesso microfono negato o non disponibile: " + errore.message;
      }
    }
  }

  function togglePausa() {
    microfonoInPausa = !microfonoInPausa;
    elBottonePausa.textContent = microfonoInPausa ? "▶ Riprendi" : "⏸ Pausa";
    elBottonePausa.classList.toggle("in-pausa", microfonoInPausa);
  }

  function terminaChiamata() {
    elBottoneTermina.disabled = true;
    elBottonePausa.disabled = true;
    // Chiude questa chiamata (il server resta acceso, pronto per la
    // prossima — vedi server_suggerimenti.py). chiamataTerminata blocca il
    // riconnetti automatico qui sotto: altrimenti, siccome il server non
    // muore più a fine chiamata, un tentativo di riconnessione andrebbe a
    // buon fine e riavvierebbe silenziosamente una chiamata (microfono
    // incluso) alcuni secondi dopo aver premuto questo pulsante, nel caso
    // in cui il browser non riesca a chiudere da solo questa scheda.
    chiamataTerminata = true;
    if (wsCorrente && wsCorrente.readyState === WebSocket.OPEN) {
      wsCorrente.send(JSON.stringify({ tipo: "termina" }));
      wsCorrente.close();
    }
    fermaMicrofono();
    elSelettoreMic.disabled = true;
    elBottoneMic.textContent = "Chiamata terminata";
    elBottonePausa.style.display = "none";
    elBottoneTermina.style.display = "none";
    elPrincipale.textContent = "Chiamata terminata. Puoi chiudere questa scheda.";
    elAlternativo.style.display = "none";

    // Prova a chiudere la scheda da sola: i browser lo permettono solo per
    // schede aperte da uno script, quindi qui potrebbe non funzionare (una
    // scheda aperta dall'app non è "sua" secondo il browser) — in quel
    // caso resta comunque il messaggio sopra per chiuderla a mano.
    setTimeout(() => window.close(), 300);
  }

  elBottoneMic.addEventListener("click", () => avviaMicrofono(false));
  elBottonePausa.addEventListener("click", togglePausa);
  elBottoneTermina.addEventListener("click", terminaChiamata);

  // Ci prova da sola all'apertura della pagina: se il permesso è già stato
  // concesso in passato per questa pagina, parte subito senza dover
  // cliccare nulla. Se è la primissima volta, il browser blocca il
  // tentativo automatico e resta il pulsante da premere una volta sola.
  avviaMicrofono(true);

  // Letto dall'URL con cui è stata aperta questa pagina (vedi
  // Contents/MacOS/avvia, avvia_chiamata_comune): distingue "Chiamata
  // YesMobility" (vuoto, flusso standard) da "Rinforzo Facile Salire"
  // (mostra subito un suggerimento iniziale dedicato, vedi
  // server_suggerimenti.py).
  const PARAMETRO_AVVIO = new URLSearchParams(window.location.search).get("avvio") || "";

  function connetti() {
    const ws = new WebSocket("ws://localhost:8765/?avvio=" + encodeURIComponent(PARAMETRO_AVVIO));
    wsCorrente = ws;

    ws.onopen = () => {
      elStato.textContent = "connesso";
      elStato.className = "connesso";
    };

    ws.onclose = () => {
      if (chiamataTerminata) return;
      elStato.textContent = "disconnesso — nuovo tentativo tra 2s";
      elStato.className = "disconnesso";
      setTimeout(connetti, 2000);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.tipo === "init") {
        // In modalità "gestione_lead" nome/telefono arrivano dal lead CRM
        // reale, iniettati direttamente nel DOM dal content script
        // dell'estensione (vedi suggerimenti-vendita-content.js) — qui non
        // vanno mai sovrascritti con il lead statico di esempio caricato
        // lato server (--contesto), altrimenti un dato vero appena arrivato
        // rischia di essere cancellato da un nome/numero finti al primo
        // messaggio "init" ricevuto dal server.
        if (PARAMETRO_AVVIO !== "gestione_lead") {
          const lead = msg.lead || {};
          elLeadNome.textContent = lead.nome || "—";
          elLeadTelefono.textContent = lead.telefono || "—";
        }
      }

      if (msg.tipo === "canovaccio") {
        const contenitore = document.getElementById("canovaccio-testo");
        contenitore.textContent = "";
        msg.testo.split(/\n\s*\n/).forEach((paragrafo) => {
          const p = document.createElement("p");
          p.textContent = paragrafo.trim();
          contenitore.appendChild(p);
        });
        document.getElementById("riquadro-canovaccio").style.display = "block";
      }

      if (msg.tipo === "trascrizione") {
        const riga = document.createElement("div");
        riga.className = "riga";
        riga.textContent = msg.testo;
        elTrascrizioni.appendChild(riga);
        elTrascrizioni.scrollTop = elTrascrizioni.scrollHeight;
      }

      if (msg.tipo === "suggerimento") {
        elFaseBadge.textContent = msg.fase_chiamata;
        elFaseBadge.style.background = COLORI_FASE[msg.fase_chiamata] || "var(--colore-default)";
        elPrincipale.textContent = msg.testo_suggerimento;
        if (msg.testo_alternativo) {
          elAlternativo.textContent = msg.testo_alternativo;
          elAlternativo.style.display = "block";
        } else {
          elAlternativo.style.display = "none";
        }
      }

      if (msg.tipo === "nessun_suggerimento") {
        elPrincipale.textContent = "Nessuno script pertinente per l'ultima frase.";
        elAlternativo.style.display = "none";
      }
    };
  }

  connetti();
</script>

</body>
</html>
