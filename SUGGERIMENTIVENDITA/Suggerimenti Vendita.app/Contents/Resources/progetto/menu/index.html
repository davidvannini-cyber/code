<!--
  Menu principale dell'app "Suggerimenti Vendita".

  Stesso identico aspetto grafico della proposta approvata (stessa palette,
  stessa tipografia, stessa struttura a pulsanti). Cambia solo il contesto:
  qui vive dentro una vera finestra nativa (vedi menu_finestra.py), non in
  un browser — quindi niente barra del titolo finta (c'è già quella vera
  della finestra) né sfondo decorativo attorno: il contenuto riempie la
  finestra.

  Ogni pulsante manda un messaggio a menu_finestra.py (via
  window.webkit.messageHandlers.menu), che rilancia questo stesso
  eseguibile dell'app con "--azione <nome>" per eseguire quella singola
  funzione — la logica di ciascuna azione resta quella già in
  Contents/MacOS/avvia, non è stata duplicata qui.
-->
<meta charset="UTF-8">
<title>Suggerimenti Vendita</title>
<style>
  :root{
    --pannello: #14171f;
    --card: #1b1f29;
    --card-hover: #232837;
    --bordo: rgba(255,255,255,.08);
    --bordo-forte: rgba(255,255,255,.16);
    --testo-1: #f3f4f6;
    --testo-2: #9ca3af;
    --testo-3: #6b7280;
    --ambra: #f59e0b;
    --ambra-hover: #fbbf24;
    --ambra-testo: #1c1300;
    --teal: #14b8a6;
    --viola: #8b5cf6;
    --blu: #3b82f6;
    --verde-traffico: #28c840;
    --giallo-traffico: #ffbd2e;
    --rosso-traffico: #ff5f57;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--pannello);
    color:var(--testo-1);
    font-family:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  }
  h1,h2,h3,.etichetta,.pulsante .titolo,.azione-primaria .titolo{
    font-family:"Manrope", "Segoe UI", Arial, sans-serif;
  }

  .contenuto{padding:22px 22px 18px;}

  .intestazione{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
  }
  .intestazione img{
    width:48px;height:48px;border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .intestazione .nome-app{font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .intestazione .sottotitolo{font-size:12.5px;color:var(--testo-2);margin-top:2px;}

  .azione-primaria{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 17px;
    border-radius:12px;
    border:1px solid #b97a08;
    background:linear-gradient(180deg, var(--ambra-hover), var(--ambra));
    color:var(--ambra-testo);
    cursor:pointer;
    font-family:inherit;
    text-align:left;
    margin-bottom:20px;
    transition:filter .12s ease, transform .12s ease, opacity .12s ease;
  }
  .azione-primaria:hover{filter:brightness(1.05);}
  .azione-primaria:active{transform:translateY(1px);}
  .azione-primaria:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .azione-primaria .icona-cerchio{
    width:38px;height:38px;border-radius:10px;
    background:rgba(28,19,0,.16);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .azione-primaria .icona-cerchio svg{width:20px;height:20px;}
  .azione-primaria .titolo{font-size:15px;font-weight:800;}
  .azione-primaria .descrizione{font-size:12px;opacity:.75;margin-top:1px;}

  .azione-secondaria{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 17px;
    border-radius:12px;
    border:1px solid #0f766e;
    background:linear-gradient(180deg, #2dd4bf, var(--teal));
    color:#042f2a;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
    margin-bottom:20px;
    transition:filter .12s ease, transform .12s ease, opacity .12s ease;
  }
  .azione-secondaria:hover{filter:brightness(1.05);}
  .azione-secondaria:active{transform:translateY(1px);}
  .azione-secondaria:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .azione-secondaria .icona-cerchio{
    width:38px;height:38px;border-radius:10px;
    background:rgba(4,47,42,.16);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .azione-secondaria .icona-cerchio svg{width:20px;height:20px;}
  .azione-secondaria .titolo{font-size:15px;font-weight:800;}
  .azione-secondaria .descrizione{font-size:12px;opacity:.75;margin-top:1px;}

  /* Stesso stile di .azione-primaria (pulsante d'azione principale in cima),
     colore viola per distinguerlo a colpo d'occhio da "Chiamata YesMobility"
     (ambra) e "Rinforzo Facile Salire" (teal). */
  .azione-viola{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 17px;
    border-radius:12px;
    border:1px solid #6d28d9;
    background:linear-gradient(180deg, #a78bfa, var(--viola));
    color:#f5f3ff;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
    margin-bottom:20px;
    transition:filter .12s ease, transform .12s ease, opacity .12s ease, box-shadow .3s ease;
  }
  .azione-viola:hover{filter:brightness(1.05);}
  .azione-viola:active{transform:translateY(1px);}
  .azione-viola:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .azione-viola .icona-cerchio{
    width:38px;height:38px;border-radius:10px;
    background:rgba(245,243,255,.18);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .azione-viola .icona-cerchio svg{width:20px;height:20px;}
  .azione-viola .titolo{font-size:15px;font-weight:800;}
  .azione-viola .descrizione{font-size:12px;opacity:.8;margin-top:1px;}

  /* Bagliore quando c'è un lead esportato dalla Lead Rework Console e non
     ancora aperto in questa modalità (vedi impostaLeadInAttesa più sotto e
     avvia_polling_lead_in_attesa in menu_finestra.py). */
  .azione-viola.lead-in-attesa{
    box-shadow:0 0 0 2px #c4b5fd, 0 0 16px 4px rgba(167,139,250,.85);
    animation:bagliore-lead 1.6s ease-in-out infinite;
  }
  @keyframes bagliore-lead{
    0%, 100%{ box-shadow:0 0 0 2px #c4b5fd, 0 0 10px 2px rgba(167,139,250,.6); }
    50%{ box-shadow:0 0 0 3px #ddd6fe, 0 0 22px 6px rgba(167,139,250,1); }
  }

  .gruppo{margin-bottom:18px;}
  .gruppo:last-child{margin-bottom:0;}
  .etichetta{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--testo-3);
    margin:0 0 9px 2px;
  }

  .griglia{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .pulsante{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 13px;
    border-radius:11px;
    border:1px solid var(--bordo);
    background:var(--card);
    color:var(--testo-1);
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    transition:background .12s ease, border-color .12s ease, transform .12s ease, opacity .12s ease;
  }
  .pulsante:hover{background:var(--card-hover);border-color:var(--bordo-forte);}
  .pulsante:active{transform:translateY(1px);}
  .pulsante:focus-visible{outline:2px solid var(--ambra);outline-offset:2px;}

  .pulsante .icona-cerchio{
    width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .pulsante .icona-cerchio svg{width:15px;height:15px;stroke:#0b0d12;}
  .ic-teal{background:var(--teal);}
  .ic-viola{background:var(--viola);}
  .ic-blu{background:var(--blu);}
  .ic-ambra{background:var(--ambra);}

  .pulsante .titolo{font-size:13px;font-weight:700;line-height:1.3;}
  .pulsante .descrizione{font-size:11px;color:var(--testo-2);margin-top:2px;line-height:1.35;}

  .piede{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-top:14px;
    border-top:1px solid var(--bordo);
  }
  .stato{
    display:flex;align-items:center;gap:7px;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;color:var(--testo-3);
  }
  .puntino-stato{width:7px;height:7px;border-radius:50%;background:var(--verde-traffico);box-shadow:0 0 6px var(--verde-traffico);transition:background .2s ease, box-shadow .2s ease;}

  .pulsante-esci{
    font-family:"IBM Plex Sans", sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--testo-2);
    background:transparent;
    border:1px solid var(--bordo);
    border-radius:8px;
    padding:6px 13px;
    cursor:pointer;
    transition:color .12s ease, border-color .12s ease;
  }
  .pulsante-esci:hover{color:var(--testo-1);border-color:var(--bordo-forte);}

  .firma{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--bordo);
  }
  .firma img{height:73px;width:auto;opacity:.92;}
  .firma .copyright{
    font-size:10px;
    color:var(--testo-3);
    text-align:center;
    letter-spacing:.01em;
  }

  /* mentre un'azione è in corso: pulsanti disattivati, non doppi click */
  button:disabled{opacity:.45;cursor:default;pointer-events:none;}

  @media (max-width: 420px){
    .griglia{grid-template-columns:1fr;}
  }
</style>

<script>
  const COLORI_STATO = {
    pronto: "#28c840",
    attenzione: "#ffbd2e",
  };

  function impostaStato(pronto, testo) {
    const puntino = document.getElementById("puntino-stato");
    const testoEl = document.getElementById("testo-stato");
    const colore = pronto ? COLORI_STATO.pronto : COLORI_STATO.attenzione;
    puntino.style.background = colore;
    puntino.style.boxShadow = "0 0 6px " + colore;
    testoEl.textContent = testo;
  }

  function bloccaBottoni() {
    document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  }

  function sbloccaBottoni() {
    document.querySelectorAll("button").forEach((b) => (b.disabled = false));
  }

  // Chiamata da menu_finestra.py (avvia_polling_lead_in_attesa), non da
  // qui: accende/spegne il bagliore sul pulsante "Chiamata Gestione Lead"
  // quando c'è (o non c'è più) un lead esportato dalla Lead Rework Console
  // in attesa di essere aperto in quella modalità.
  function impostaLeadInAttesa(attivo) {
    const bottone = document.getElementById("btn-gestione-lead");
    if (bottone) bottone.classList.toggle("lead-in-attesa", !!attivo);
  }

  function eseguiAzione(nome) {
    if (nome !== "esci") {
      bloccaBottoni();
    }
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.menu) {
      window.webkit.messageHandlers.menu.postMessage(nome);
    }
  }
</script>
