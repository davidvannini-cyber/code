<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Stessa grafica di LEADREWORKS (SALESASSISTANT/LEADREWORKS/src/lead-rework-console.html): tema chiaro,
     barra in alto, schede grigie con ombra, campi e bottoni compatti. Se cambi lì palette o misure, allinea qui. */
  :root{
    --bg:#ffffff; --panel:#e8e8ec; --panel-hover:#dcdce2; --panel-raised:#f0f0f4;
    --border:rgba(0,0,0,.08); --border-strong:#d0d0d8;
    --text:#1a1f2e; --text-dim:#6b7280;
    --primary:#14b8a6; --primary-dark:#0f766e; --primary-text:#042f2a;
    --accent:#28c840; --danger:#ff5f57; --warn:#f59e0b;
    --topnav:#ececf0; --topnav-active:#14b8a6;
    --radius:2px;
    --font-body:"IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --font-head:"Manrope","IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --field-bg:#ffffff; --field-text:#1a1f2e; --field-placeholder:#a0a0a8;
    --output-field-bg:#cdf5ef; --output-field-text:#0b1f1c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);}
  a{color:var(--primary-dark);text-decoration:none;} a:hover{text-decoration:underline;}
  .topnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;background:var(--topnav);border-bottom:1px solid var(--border);padding:0 10px;min-height:30px;}
  .topnav .brand{font-family:var(--font-head);font-weight:800;font-size:9px;letter-spacing:-.01em;white-space:nowrap;text-transform:uppercase;}
  .topnav .count{font-family:var(--font-head);font-weight:700;font-size:9px;color:var(--text-dim);}
  .topnav-right{margin-left:auto;display:flex;align-items:center;font-size:9px;color:var(--text-dim);}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .page{max-width:1120px;margin:0 auto;padding:8px 14px 16px;}
  h1{font-family:var(--font-head);font-weight:800;font-size:16px;margin:0 0 1px 0;letter-spacing:-.01em;}
  .subtitle{color:var(--text-dim);font-size:9px;margin-bottom:6px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);}
  input,select,textarea{width:auto;padding:2px 8px;border:1px solid var(--border-strong);border-radius:2px;font-size:11px;font-family:inherit;background:var(--field-bg);color:var(--field-text);box-shadow:inset 0 1px 3px rgba(0,0,0,.08);}
  input[type=search],select{height:28px;padding:4px 8px;}
  input[type=checkbox]{box-shadow:none;accent-color:var(--primary);margin:0;}
  select{color-scheme:light;} input::placeholder,textarea::placeholder{color:var(--field-placeholder);}
  textarea{width:100%;min-height:140px;margin:8px 0;resize:vertical;line-height:1.35;font-family:"IBM Plex Mono",ui-monospace,monospace;}
  button{cursor:pointer;border:none;border-radius:2px;padding:6px 16px;font-size:11px;font-weight:700;font-family:var(--font-head);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--primary);color:var(--primary-text);} .btn-primary:hover{background:#2dd4bf;}
  .btn-secondary{background:var(--output-field-bg);color:var(--output-field-text);border:1px solid var(--border);} .btn-secondary:hover{background:#b8ece3;}
  .btn-danger{background:rgba(255,95,87,.12);color:#c2392f;border:1px solid rgba(255,95,87,.35);} .btn-danger:hover{background:rgba(255,95,87,.2);}
  .btn-ghost{background:transparent;color:#c2392f;padding:2px 6px;} .btn-ghost:hover{background:rgba(0,0,0,.04);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=search]{flex:1 1 200px;min-width:0;}
  .wrap{overflow-x:auto;}
  table{width:100%;min-width:760px;border-collapse:collapse;font-size:11px;}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.25;}
  th{color:var(--text-dim);font-size:9px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;white-space:nowrap;}
  tr:hover td{background:rgba(0,0,0,.02);}
  td.msg{max-width:320px;color:var(--text-dim);}
  td select{height:22px;padding:0 4px;}
  .muted{color:var(--text-dim);} .empty{padding:32px;text-align:center;color:var(--text-dim);}
  .collapsible-toggle{font-size:9px;color:var(--primary-dark);cursor:pointer;font-weight:700;user-select:none;}
  #msg{margin-left:8px;font-size:9px;}
  footer{text-align:center;padding:4px 0 24px;}
</style>
</head>
<body>
<div class="topnav">
  <div class="brand">Lead Collector</div>
  <div class="count" id="count"></div>
  <div class="topnav-right"><span class="dot"></span>Sistema attivo</div>
</div>
<div class="page">
  <h1>Lead ricevuti</h1>
  <div class="subtitle">Email con lead → tabella. Cerca, filtra, segna lo stato e controlla cosa è già stato esportato in LEADREWORKS.</div>
  <div class="card">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Cerca…">
      <select id="st"><option value="">Tutti gli stati</option><option>nuovo</option><option>contattato</option><option>qualificato</option><option>perso</option></select>
      <select id="ex"><option value="">Tutti (esportati e non)</option><option value="no">Non esportati</option><option value="si">Esportati</option></select>
      <button class="btn-secondary" id="refresh">Aggiorna</button>
      <a href="/api/export.csv"><button type="button" class="btn-secondary">Esporta CSV</button></a>
    </div>
  </div>
  <div class="card">
    <details>
      <summary class="collapsible-toggle">Aggiungi a mano una email (incolla il testo o il sorgente .eml)</summary>
      <textarea id="paste" placeholder="Incolla qui l'email…"></textarea>
      <button class="btn-primary" id="add">Estrai lead</button><span id="msg" class="muted"></span>
    </details>
  </div>
  <div class="card wrap"><table>
    <thead><tr id="head"></tr></thead><tbody id="body"></tbody>
  </table></div>
  <footer><button class="btn-danger" id="quit">⏻ Chiudi Lead Collector</button></footer>
</div>
<script>
const COLS = [['receivedAt','Ricevuto'],['name','Nome'],['email','Email'],['phone','Telefono'],['company','Azienda'],['city','Città'],['message','Messaggio'],['status','Stato'],['exported','Esportato'],['subject','Oggetto']];
let leads = [], sort = ['receivedAt', -1];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('head').innerHTML = COLS.map(([k,l]) => `<th data-k="${k}">${l}</th>`).join('') + '<th></th>';
$('head').onclick = e => { const k = e.target.dataset.k; if (!k) return; sort = [k, sort[0] === k ? -sort[1] : 1]; render(); };

async function load() { leads = await (await fetch('/api/leads')).json(); render(); }
function render() {
  const q = $('q').value.toLowerCase(), st = $('st').value, ex = $('ex').value;
  let rows = leads.filter(l => (!st || l.status === st) && (!ex || (ex === 'si') === !!l.exported) && (!q || Object.values(l).join(' ').toLowerCase().includes(q)));
  rows.sort((a,b) => String(a[sort[0]]||'').localeCompare(String(b[sort[0]]||'')) * sort[1]);
  $('count').textContent = `(${rows.length}/${leads.length})`;
  $('body').innerHTML = rows.length ? rows.map(l => `<tr>
    <td>${esc(new Date(l.receivedAt).toLocaleString('it-IT'))}</td>
    <td>${esc(l.name)}</td>
    <td>${l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : ''}</td>
    <td>${l.phone ? `<a href="tel:${esc(l.phone.replace(/[^\d+]/g,''))}">${esc(l.phone)}</a>` : ''}</td>
    <td>${esc(l.company)}</td><td>${esc(l.city)}</td>
    <td class="msg">${esc(l.message)}</td>
    <td><select data-id="${l.id}" class="s">${['nuovo','contattato','qualificato','perso'].map(s => `<option${s===l.status?' selected':''}>${s}</option>`).join('')}</select></td>
    <td><label title="${l.exported && l.exportedAt ? 'Esportato il ' + esc(new Date(l.exportedAt).toLocaleString('it-IT')) : 'Non ancora esportato'}"><input type="checkbox" data-ex="${l.id}"${l.exported ? ' checked' : ''}></label></td>
    <td class="muted">${esc(l.subject)}</td>
    <td><button class="btn-ghost" data-del="${l.id}" title="Elimina">✕</button></td></tr>`).join('')
    : `<tr><td colspan="${COLS.length+1}" class="empty">Nessun lead. Inoltra una email all'endpoint o incollala qui sopra.</td></tr>`;
}
$('body').onchange = async e => {
  if (e.target.dataset.ex) { await fetch('/api/leads/' + e.target.dataset.ex, { method:'PATCH', body: JSON.stringify({ exported: e.target.checked }) }); load(); return; }
  if (e.target.classList.contains('s')) { await fetch('/api/leads/' + e.target.dataset.id, { method:'PATCH', body: JSON.stringify({ status: e.target.value }) }); load(); } };
$('body').onclick = async e => { const id = e.target.dataset.del; if (id && confirm('Eliminare il lead?')) { await fetch('/api/leads/' + id, { method:'DELETE' }); load(); } };
$('q').oninput = $('st').onchange = $('ex').onchange = render;
$('refresh').onclick = load;
$('add').onclick = async () => {
  const r = await (await fetch('/api/paste', { method:'POST', body: $('paste').value })).json();
  $('msg').textContent = r.added ? 'Lead aggiunto ✓' : 'Non aggiunto: ' + (r.reason || r.error);
  if (r.added) { $('paste').value = ''; load(); }
};
$('quit').onclick = async () => {
  if (!confirm('Chiudere Lead Collector? Il server si ferma e non riceverai nuovi lead finché non lo riavvii.')) return;
  let r;
  try { r = await fetch('/api/shutdown', { method: 'POST' }); } catch (e) { r = { ok: true }; } // il server si ferma: la risposta può non arrivare
  if (!r.ok) { alert('Chiusura non riuscita (errore ' + r.status + '): ' + await r.text()); return; }
  setTimeout(() => window.close(), 400);
  document.body.innerHTML = '<p style="padding:48px;text-align:center;font:16px system-ui">Lead Collector chiuso. Puoi chiudere questa scheda.</p>';
};
load(); setInterval(load, 30000);
</script>
</body>
</html>
